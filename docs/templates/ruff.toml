# Base Ruff configuration for ATRIUM tools
line-length = 120

extend-exclude = [
    "data_samples/",
    "result/",
    "supplementary/",
    "tests/fixtures/",
    "service/frontend*/"
]

[lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"] # Defer strict line-length checks initially

[lint.isort]
# The hub-canonical shared modules are FIRST-PARTY wherever they are consumed, but
# ruff cannot infer that uniformly: in a tool repo they sit at the repo root and are
# detected automatically, while in the hub they live in docs/templates/shared/, which
# is not an importable source root, so detection classified them as third-party.
#
# That divergence is not cosmetic. `test_document_originators.py` and
# `test_para_licenses.py` are held BYTE-IDENTICAL across the hub and all five tool
# repos by para-drift, and the two classifications demand mutually exclusive import
# formatting: as third-party, isort wants `import pytest` and `from atrium_document
# import ...` in one block; as first-party it wants a blank line between them. One
# file cannot satisfy both -- so `ruff check --fix` in the hub produced a file that
# failed `ruff check` in all five tool repos, and fixing it there broke the hub again.
# An unwinnable loop for whoever re-vendors next.
#
# Declaring the classification explicitly makes it layout-independent, so the shared
# files lint identically in both places. This lives in the SHARED template (not the
# hub's own ruff.toml) for two reasons: ruff resolves the nearest config to each file,
# and this one is nearest to docs/templates/shared/; and every tool repo copies this
# template, so they inherit the same explicit classification instead of relying on
# root-detection that happens to agree today. (issue #10, D9)
known-first-party = [
    "atrium_document",
    "atrium_paradata",
    "atrium_service",
    "para_licenses",
    "check_version",
]
