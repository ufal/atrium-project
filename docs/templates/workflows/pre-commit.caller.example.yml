# EXAMPLE caller for ufal/atrium-project/.github/workflows/pre-commit.reusable.yml
#
# Copy to <tool-repo>/.github/workflows/pre-commit.yml and set the branch list.
# Replaced the standalone template on 2026-07-30 (#18, T3).
#
# BLOCKING across the ecosystem — a failing hook fails the check. The repo's own
# .pre-commit-config.yaml and ruff.toml still decide WHAT runs; the reusable only
# standardises how it is invoked (and adds the hook-environment cache, which only
# two of the five previously had).
#
# Prerequisite: the repo must have a .pre-commit-config.yaml at its root. See
# docs/templates/.pre-commit-config.example.yaml.

name: pre-commit

on:
  push:
    branches: [test, master]     # use THIS repo's real branches
  pull_request:
    branches: [test, master]     # keep identical to push, or PRs skip the check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    uses: ufal/atrium-project/.github/workflows/pre-commit.reusable.yml@v1
    # Optional:
    #   with:
    #     python-version: "3.12"
    #     extra-args: "--all-files"   # drop --show-diff-on-failure
