# atrium-project — generic self-hosted GPU inference tests
# Drops into: .github/workflows/gpu-inference.yml
#
# ⚠️ INFRA-GATED — requires an ARUP self-hosted runner with an NVIDIA GPU
# registered with labels [self-hosted, gpu] and NVIDIA Container Toolkit installed.
#
# Manual dispatch only (atrium-project#69). The GPU runner is deferred with
# atrium-project#40, and a `schedule:` aimed at labels no runner carries queues a job
# every week that waits until it times out -- a red run for infrastructure that does
# not exist yet. Add the cron back in the same change that registers the runner:
#   schedule:
#     - cron: "0 2 * * 0"   # weekly, Sunday 02:00 UTC

name: GPU Inference Tests

on:
  workflow_dispatch:

# A self-hosted runner is a SHARED, PERSISTENT machine: two overlapping runs fight
# over the same GPU and the same HF cache, and the loser reports a CUDA OOM that
# looks like a model bug. Serialise, and never cancel a run mid-inference.
concurrency:
  group: gpu-inference-${{ github.ref }}
  cancel-in-progress: false

# Least privilege, stated explicitly rather than inherited (#18). This workflow
# only reads the repo; it publishes nothing.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Template vars to be localized per repository:
  APT_PACKAGES: "build-essential g++ libgl1 libglib2.0-0 poppler-utils"
  REQUIREMENTS: "requirements.txt service/requirements.txt requirements-test.txt setup/requirements.txt"

jobs:
  gpu-tests:
    runs-on: [self-hosted, gpu]
    # Generous, because model download + inference on a cold cache is genuinely slow
    # — but finite. On a self-hosted runner the 6-hour default does not just waste a
    # hosted minute, it holds the ONLY GPU the ecosystem has.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Show GPU
        run: nvidia-smi

      # Template vars reach the shell as environment variables, never as `${{ env.* }}`
      # substituted into the script text (see scheduled-smoke.caller.example.yml).
      - name: Install APT packages
        if: env.APT_PACKAGES != ''
        run: |
          # shellcheck disable=SC2086 # a space-separated package list
          sudo apt-get update && sudo apt-get install -y $APT_PACKAGES

      - name: Install dependencies (CUDA torch)
        run: |
          python -m pip install --upgrade pip
          # cu126 matches the standard Dockerfile TORCH_INDEX_URL for GPU builds
          pip install torch==2.7.1 torchvision==0.22.1 \
              --index-url https://download.pytorch.org/whl/cu126

          for req in $REQUIREMENTS; do
            if [ -f "$req" ]; then pip install -r "$req"; fi
          done
          pip install pytest

      - name: Run GPU (slow) tests
        env:
          PYTHONPATH: .
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pytest -m slow -v --tb=short
