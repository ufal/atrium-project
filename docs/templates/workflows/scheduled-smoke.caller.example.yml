# atrium-project — generic scheduled "slow lane" smoke tests
# Drops into: .github/workflows/scheduled-smoke.yml
#
# PR CI runs `pytest -m "not slow"`. This nightly job catches upstream breakage
# (moved/renamed HF models, vanishing external APIs, reachability issues).
#
# No `pip-audit` step (atrium-project#69). This template used to run
# `pip-audit || true`, which can never fail: a gate in name only, copied into every
# repo that adopted it. A real audit gate is roadmap H7, retired for now in
# docs/docker_gha_roadmap.md §10; the image-level gate is Trivy's fixable-CRITICAL
# check in docker-tool.reusable.yml. Add an audit here only as a step that can fail.

name: Scheduled Smoke Tests

on:
  schedule:
    - cron: "0 3 * * *"    # daily 03:00 UTC
  workflow_dispatch:

# A nightly that overlaps its own previous run (a slow external API, a stuck model
# download) doubles the load on the very upstream it is probing. Serialise, but do
# not cancel: a partial smoke reports nothing useful.
concurrency:
  group: scheduled-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Template vars to be localized per repository:
  APT_PACKAGES: "build-essential g++"
  PRE_INSTALL_TORCH: "torch"
  REQUIREMENTS: "requirements.txt service/requirements.txt requirements-test.txt"

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    # This lane pulls models and calls external APIs, so it is legitimately slow —
    # but a hung external call must not hold a runner for the 6-hour default.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # The three template vars reach the shell as environment variables, never as
      # `${{ env.* }}` pasted into the script: an expression is substituted into the
      # script TEXT before bash sees it, so a value with a quote or `;` in it becomes
      # code. They are in the workflow's `env:` block already, so `$VAR` reads them.
      # Word-splitting of the lists is intended, hence no quotes.
      - name: Install APT packages
        if: env.APT_PACKAGES != ''
        run: |
          # shellcheck disable=SC2086 # a space-separated package list
          sudo apt-get update && sudo apt-get install -y $APT_PACKAGES

      - name: Pre-install PyTorch (CPU)
        if: env.PRE_INSTALL_TORCH != ''
        run: |
          # shellcheck disable=SC2086 # a space-separated requirement list
          pip install $PRE_INSTALL_TORCH --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          for req in $REQUIREMENTS; do
            if [ -f "$req" ]; then pip install -r "$req"; fi
          done
          pip install pytest pytest-cov

      - name: Run slow tests (network + models)
        env:
          PYTHONPATH: .
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pytest -m slow -v --tb=short

      # One open issue per failing lane, commented on by each later failure; scheduled runs only
      # (atrium-project#81, docs/ci_policy.md, Noise).
      - name: Open or update the lane's issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: ufal/atrium-project/.github/actions/lane-failure-issue@v1
        with:
          lane: scheduled-smoke
          title: Scheduled smoke tests failed
          labels: ci,upstream
          body: |
            The scheduled `slow` test run failed. Likely an upstream change (Hugging Face model or
            revision, an external dependency, or the network).
