# EXAMPLE caller for ufal/atrium-project/.github/workflows/para-drift.reusable.yml
#
# Copy to <tool-repo>/.github/workflows/para-drift.yml. No inputs are required.
#
# The reusable checks out this repo AND the hub, then `diff -u`s every canonical
# shared file against docs/templates/shared/ — reading the single list at
# docs/templates/shared/MANIFEST.json (atrium-project#59), currently 16 files, not
# a fixed list hand-copied into this comment. That list grows independently of
# this template; see MANIFEST.json itself for what it holds today.
#
# A failure here means someone edited a vendored copy. Fix it by editing the HUB
# copy and re-vendoring (scripts/revendor_shared.sh) — never the other way round.

name: Paradata Canonical Drift

on:
  push:
    branches: [test, master]     # use THIS repo's real branches
  pull_request:
    branches: [test, master]     # keep identical to push, or PRs skip the check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@v1
