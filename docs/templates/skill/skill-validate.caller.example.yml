# Caller example — Agent-Skill branch validation (atrium-project#31, strategy §12.3).
# Place as .github/workflows/skill-validate.yml ON THE `agent-skill` BRANCH of a
# service repo and fill in that repo's row from the table below. The `app-import` and
# `primary-endpoints` values are the same ones the default branch's
# tests/test_api_contract.py uses (issue #32), so the skill branch and the default
# branch assert the same contract.
#
#   repo                        client-script                  app-import        primary-endpoints
#   -----------------------------------------------------------------------------------------------------
#   atrium-page-classification  scripts/atrium_classify.py     service.api       /predict_image /predict_document
#   atrium-translator           scripts/atrium_translate.py    service.api       /translate
#   atrium-alto-postprocess     scripts/atrium_postprocess.py  service.text_api  /process
#   atrium-nlp-enrich           scripts/atrium_enrich.py       service.api       /enrich /enrich_text /rescale /jobs
#   atrium-llm-enrich           scripts/atrium_keywords.py     service.api       /extract_keywords /extract_keywords_text

name: Skill Branch Validation

on:
  push:
    branches: [agent-skill]
  pull_request:
    branches: [agent-skill]

jobs:
  skill-validate:
    uses: ufal/atrium-project/.github/workflows/skill-validate.reusable.yml@test
    with:
      client-script: scripts/atrium_classify.py
      app-import: service.api
      primary-endpoints: "/predict_image /predict_document"
      # skill-docs: "SKILL.md README.md service/README.md"   # (default)
      # service-requirements: service/requirements.txt        # (default)
      # python-version: "3.11"                                # (default)
