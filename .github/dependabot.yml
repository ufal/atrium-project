# atrium-project — Dependabot
#
# This repo hosts the reusable workflows every tool repo calls
# (docker-tool / security / api-contract / para-drift / skill-validate), so its
# action pins are the ecosystem's pins. Until this file existed, all five tool
# repos auto-updated their actions while the hub's own reusables never did —
# which is exactly how docker-tool.reusable.yml ended up on checkout@v7 while
# security.reusable.yml sat on @v5 and api-contract.reusable.yml on
# setup-python@v5 (issue #18, 2026-07-29 audit).
#
# github-actions only: this repo ships no Python package manifest — tools/e2e/
# installs each tool repo's own requirements at runtime inside
# e2e-pipeline-smoke.yml, and those are covered by the tool repos' Dependabot.
#
# Grouped into a single PR and targeted at `test`, matching the convention in
# atrium-translator / atrium-alto-postprocess / atrium-page-classification.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "test"
    groups:
      actions:
        patterns:
          - "*"

  # Runtime + test deps for the pipeline scripts. This entry previously sat at
  # directory "/", where the only requirements file was a duplicate of
  # setup/requirements-test.txt — so setup/ and service/ (the files the Dockerfile
  # and the CI workflows actually install) were never scanned. One entry per real
  # requirements directory.
  - package-ecosystem: "pip"
    directory: "/setup"
    schedule:
      interval: "weekly"
    target-branch: "test"
    groups:
      setup-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "transformers"
        versions: [">= 5.0.0"]
      # numpy 2.5.0 raised its floor to Requires-Python >= 3.12. This repo is 3.11
      # everywhere -- the CI setup-python, ruff's target-version, and the Dockerfile's
      # python:3.11-slim base -- so `numpy>=2.5.1` is not a code incompatibility, it is
      # an UNSATISFIABLE requirement: pip cannot resolve any candidate and the install
      # step fails before a test runs. PR #39 sat red for a week for that reason, and no
      # amount of fixing the code would have turned it green.
      #
      # Lift this when the repo moves to 3.12, which is a deliberate decision about the
      # base image and not something a dependency bump should make for us.
      # (issue atrium-project#10)
      - dependency-name: "numpy"
        versions: [">= 2.5.0"]

  # FastAPI service layer.
  - package-ecosystem: "pip"
    directory: "/service"
    schedule:
      interval: "weekly"
    target-branch: "test"
    groups:
      service-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "transformers"
        versions: [">= 5.0.0"]
      # numpy 2.5.0 raised its floor to Requires-Python >= 3.12. This repo is 3.11
      # everywhere -- the CI setup-python, ruff's target-version, and the Dockerfile's
      # python:3.11-slim base -- so `numpy>=2.5.1` is not a code incompatibility, it is
      # an UNSATISFIABLE requirement: pip cannot resolve any candidate and the install
      # step fails before a test runs. PR #39 sat red for a week for that reason, and no
      # amount of fixing the code would have turned it green.
      #
      # Lift this when the repo moves to 3.12, which is a deliberate decision about the
      # base image and not something a dependency bump should make for us.
      # (issue atrium-project#10)
      - dependency-name: "numpy"
        versions: [">= 2.5.0"]
