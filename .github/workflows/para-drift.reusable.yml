name: Paradata Drift Check
on:
  workflow_call:
    inputs:
      hub-ref:
        description: >-
          Ref to read the canonical docs/templates/shared/* files from. Keep this
          in step with the ref THIS workflow is called at, or the check compares
          against the wrong generation of templates.

          Was hardcoded to `test` (#18). That left the pinning half-done: with
          callers on the immutable `@v1`, the workflow LOGIC came from the tag
          while the FILES it enforces still came from a mutable branch — so any
          push to `test` still changed what every pinned caller enforced, which
          defeats the pin for the one reusable whose whole job is comparing files.

          Callers on the `@test` pre-release channel should pass `hub-ref: test`
          to stay self-consistent.
        required: false
        type: string
        default: v1

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  drift-check:
    name: Verify Canonical Paradata Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller tool repository
        uses: actions/checkout@v7
        with:
          path: tool-repo

      - name: Checkout ATRIUM hub repository
        uses: actions/checkout@v7
        with:
          repository: ufal/atrium-project
          ref: ${{ inputs.hub-ref }}
          path: hub-repo

      - name: Verify atrium_paradata.py parity
        run: diff -u tool-repo/atrium_paradata.py hub-repo/docs/templates/shared/atrium_paradata.py

      - name: Verify para_licenses.py parity
        run: diff -u tool-repo/para_licenses.py hub-repo/docs/templates/shared/para_licenses.py

      - name: Verify test_para_licenses.py parity
        run: diff -u tool-repo/tests/test_para_licenses.py hub-repo/docs/templates/shared/test_para_licenses.py

      - name: Verify tests/test_document_originators.py parity (issue #10, D9)
        # The §1a origin contract's only substantive test. It lived in ONE repo
        # (llm-enrich) while docs/document_schema.md and atrium_document.py both
        # cited it as what "pins" the contract — so the hub could not run the test
        # guarding the standard it authors, and the other four repos had no origin
        # coverage at all. Promoted to the canonical set and enforced here, exactly
        # like test_para_licenses.py above. Edit the hub copy, never a vendored one;
        # scripts/revendor_shared.sh does the copy.
        run: diff -u tool-repo/tests/test_document_originators.py hub-repo/docs/templates/shared/test_document_originators.py

      - name: Verify service/atrium_service.py parity (issue #32, strategy §4)
        run: diff -u tool-repo/service/atrium_service.py hub-repo/docs/templates/shared/atrium_service.py

      - name: Verify service/healthcheck.py parity (issue #55)
        # The Docker HEALTHCHECK probe body. Kept canonical for the same reason as
        # atrium_service.py above: a hand-rolled per-repo probe is exactly the kind of
        # near-identical drift this mechanism exists to prevent. Edit the hub copy,
        # never a vendored one; scripts/revendor_shared.sh does the copy.
        run: diff -u tool-repo/service/healthcheck.py hub-repo/docs/templates/shared/healthcheck.py

      - name: Verify atrium_document.py parity
        run: diff -u tool-repo/atrium_document.py hub-repo/docs/templates/shared/atrium_document.py

      - name: Verify atrium_document.schema.json parity
        run: diff -u tool-repo/atrium_document.schema.json hub-repo/docs/templates/shared/atrium_document.schema.json

      - name: Verify atrium_vocab.py parity (issue #51)
        # The controlled-label registry. Byte-parity matters more here than for most
        # canonical files: the module IS the declaration of which label values are
        # legal in `lines[].categ`, `pages[].category` and friends, so a repo running a
        # stale copy would validate its output against a label set nobody else agrees
        # with -- the exact drift the registry was written to end. Edit the hub copy,
        # never a vendored one; scripts/revendor_shared.sh does the copy.
        run: diff -u tool-repo/atrium_vocab.py hub-repo/docs/templates/shared/atrium_vocab.py

      - name: Verify atrium_vocab.schema.json parity (issue #51)
        run: diff -u tool-repo/atrium_vocab.schema.json hub-repo/docs/templates/shared/atrium_vocab.schema.json

      - name: Verify tests/test_atrium_vocab.py parity (issue #51)
        # Canonical for the same reason as test_document_originators.py: the registry is
        # a cross-repo contract, so the test pinning it has to run everywhere the
        # contract is relied on, not only in the repo that authored it.
        run: diff -u tool-repo/tests/test_atrium_vocab.py hub-repo/docs/templates/shared/test_atrium_vocab.py

      - name: Registry self-test (issue #51)
        # Cheap, hermetic, stdlib-only: proves the vendored registry's own tables are
        # internally consistent and that both serialisations still render. A parity
        # diff proves the bytes match; this proves the bytes are not matching garbage.
        run: python3 tool-repo/atrium_vocab.py --selftest

      - name: Verify atrium_rocrate.py parity (issue #54)
        # Registered in revendor_shared.sh's SHARED_FILES and SELFTESTS from the start,
        # but never here or in the ruff `[format] exclude` list — two of the three
        # registrations that script's header warns are "silent" if missed. Both went
        # missing at once, and the result was the failure mode the header predicts:
        # nlp-enrich's copy was reflowed to its local line-length (100 against 120 in
        # three other repos) and sat 92 lines from canonical with nothing looking.
        run: diff -u tool-repo/atrium_rocrate.py hub-repo/docs/templates/shared/atrium_rocrate.py

      - name: RO-Crate exporter self-test (issue #54)
        # SELFTESTS in revendor_shared.sh has listed this since the file was added; the
        # step it mirrors did not exist. Same reasoning as the registry self-test above.
        run: python3 tool-repo/atrium_rocrate.py --selftest

      - name: Verify tests/test_atrium_rocrate.py parity (issue #54)
        # The exporter shipped with no test anywhere in the ecosystem — 319 statements
        # vendored into five repos, and atrium-translator's coverage ratchet (81, the
        # strictest) was the only thing that noticed, failing at 72.90%. Enforced here
        # like test_document_originators.py above, so the module and the test that
        # covers it travel together. Edit the hub copy, never a vendored one;
        # scripts/revendor_shared.sh does the copy.
        run: diff -u tool-repo/tests/test_atrium_rocrate.py hub-repo/docs/templates/shared/test_atrium_rocrate.py

      - name: Verify check_version.py parity (issue #18)
        # The release gate and security.reusable.yml's version-check both run this
        # vendored script. It replaced ~360 lines of copy-pasted inline python that
        # had already drifted between call sites; this step is what stops it
        # drifting again. Edit the hub copy, never a vendored one.
        run: diff -u tool-repo/check_version.py hub-repo/docs/templates/shared/check_version.py
