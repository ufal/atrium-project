name: Paradata Drift Check
on:
  workflow_call:
    inputs:
      hub-ref:
        description: >-
          Ref to read the canonical docs/templates/shared/* files from. Keep this
          in step with the ref THIS workflow is called at, or the check compares
          against the wrong generation of templates.

          Was hardcoded to `test` (#18). That left the pinning half-done: with
          callers on the immutable `@v1`, the workflow LOGIC came from the tag
          while the FILES it enforces still came from a mutable branch — so any
          push to `test` still changed what every pinned caller enforced, which
          defeats the pin for the one reusable whose whole job is comparing files.

          Callers on the `@test` pre-release channel should pass `hub-ref: test`
          to stay self-consistent.
        required: false
        type: string
        default: v1
      vendored-from:
        description: >-
          Space-separated ufal repositories this caller vendors files from with SHA pins, in
          tests/test_vendored_*_parity.py (atrium-project#72 B: the tool-to-tool shared layers,
          e.g. digital-convert's copy of nlp-enrich's TEITOK reader). When set, the vendored-parity
          job reads each pin file's ADOPTED owner and commit (tools/ci/vendored_pins.py), checks
          the owner out at that commit beside the caller, and runs the pin tests, whose sibling
          half compares every copy byte for byte with the owner's file (atrium-project#82 B.2).
          A pin file whose owner is not listed here fails. Empty (the default) skips the job.
        required: false
        type: string
        default: ""
      vendored-ref:
        description: >-
          The owners' ref the advisory "owner ahead" summary compares the copies with
          (atrium-project#82 B.3). `test`, the integration branch, so a change in the owner shows
          in the consumer's summary before either releases. It never fails the job: adopting the
          change is the consumer's decision.
        required: false
        type: string
        default: test
      vendored-tests:
        description: The pin tests to run, as a shell glob relative to the caller's root.
        required: false
        type: string
        default: tests/test_vendored_*_parity.py

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  drift-check:
    name: Verify Canonical Paradata Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller tool repository
        uses: actions/checkout@v7
        with:
          path: tool-repo

      - name: Checkout ATRIUM hub repository
        uses: actions/checkout@v7
        with:
          repository: ufal/atrium-project
          ref: ${{ inputs.hub-ref }}
          path: hub-repo


      - name: Verify canonical shared files (atrium-project#59)
        # One loop over docs/templates/shared/MANIFEST.json (24 files), read
        # through tools/shared_manifest.py --tsv, the manifest's one reader:
        # scripts/revendor_shared.sh and tools/skill_drift_check.py read it the
        # same way, so the three cannot disagree on the file list (#59). Every
        # entry: byte parity. Entries marked `selftest: true` also run their
        # `--selftest` on the VENDORED copy, as revendor_shared.sh does.
        # Adding a canonical file is one row in the manifest.
        run: |
          set -euo pipefail
          fail=0
          while IFS=$'\t' read -r canonical dest selftest _precondition; do
            src="hub-repo/docs/templates/shared/$canonical"
            dst="tool-repo/$dest"
            echo "::group::$dest"
            if [ ! -f "$dst" ]; then
              echo "MISSING: tool-repo has no $dest"
              fail=1
              echo "::endgroup::"
              continue
            fi
            if ! diff -u "$dst" "$src"; then
              echo "MISMATCH: $dest differs from the canonical $canonical"
              fail=1
            else
              echo "ok: $dest matches the canonical $canonical"
            fi
            if [ "$selftest" = "1" ]; then
              echo "-- self-test: python3 $dst --selftest"
              if ! python3 "$dst" --selftest; then
                echo "SELFTEST FAILED: $dest"
                fail=1
              fi
            fi
            echo "::endgroup::"
          done < <(python3 hub-repo/tools/shared_manifest.py --tsv hub-repo/docs/templates/shared/MANIFEST.json)
          exit "$fail"

  vendored-parity:
    # atrium-project#72 B: para-drift over the tool-to-tool layers. The hub-canonical files above
    # are compared with the hub; a layer one tool owns and another vendors (the TEITOK reader, the
    # document reader) is compared with its owner by the pin tests the consumer already has.
    # atrium-project#82 B: the blocking comparison is with the owner at the commit the consumer
    # adopted (ADOPTED["commit"] in each pin file), so a push to the owner never turns a consumer
    # red; how far the owner has moved on since is a summary, not a failure. The pin tests skip
    # their sibling comparison when the owner is not checked out beside the consumer, which is
    # what they do in every other CI job; here it is, so a skip is a failure.
    name: Verify Vendored Copies Against Their Owners
    if: inputs.vendored-from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONSUMER: ${{ github.event.repository.name }}
    steps:
      - name: Checkout caller tool repository
        uses: actions/checkout@v7
        with:
          # The pin tests find their owner at ../<owner>, so both sit side by side under work/.
          path: work/${{ github.event.repository.name }}

      - name: Checkout the hub's pin reader
        uses: actions/checkout@v7
        with:
          repository: ufal/atrium-project
          ref: ${{ inputs.hub-ref }}
          path: hub-repo
          sparse-checkout: tools/ci/vendored_pins.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Read the pins
        working-directory: work/${{ github.event.repository.name }}
        env:
          OWNERS: ${{ inputs.vendored-from }}
          TESTS: ${{ inputs.vendored-tests }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # shellcheck disable=SC2206 — TESTS is a glob, expanded here on purpose
          files=( $TESTS )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no pin tests match '$TESTS'"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/hub-repo/tools/ci/vendored_pins.py" list "${files[@]}" \
            --owners "$OWNERS" > "$RUNNER_TEMP/pins.tsv"
          cat "$RUNNER_TEMP/pins.tsv"

      - name: Run each pin test against its owner at the adopted commit
        working-directory: work
        run: |
          set -euo pipefail
          pip install --quiet pytest
          while IFS=$'\t' read -r -u 3 file owner commit release; do
            rm -rf "$owner"
            git init --quiet "$owner"
            git -C "$owner" fetch --quiet --depth 1 "https://github.com/ufal/$owner.git" "$commit"
            git -C "$owner" checkout --quiet FETCH_HEAD
            echo "::group::$file against $owner at ${commit:0:7} ($release)"
            (cd "$CONSUMER" && python -m pytest -rs -p no:cacheprovider "$file") | tee "$RUNNER_TEMP/pins.log"
            echo "::endgroup::"
            if grep -q '^SKIPPED' "$RUNNER_TEMP/pins.log"; then
              echo "::error::$file skipped its comparison with $owner: the owner checkout is not where the test looks"
              exit 1
            fi
          done 3< "$RUNNER_TEMP/pins.tsv"

      - name: Summarise the copies the owners have changed since
        # ci-optional: advice by design (atrium-project#82 B.3); adopting an owner's change is the consumer's decision
        continue-on-error: true
        working-directory: work
        env:
          REF: ${{ inputs.vendored-ref }}
        run: |
          set -uo pipefail
          rows=""
          while IFS=$'\t' read -r -u 3 file owner commit release; do
            dir="ahead/$owner"
            if [ ! -d "$dir" ] && ! git clone --quiet --depth 1 --branch "$REF" "https://github.com/ufal/$owner.git" "$dir"; then
              echo "::warning::cannot clone $owner at $REF; no owner-ahead summary for $file"
              continue
            fi
            head="$(git -C "$dir" rev-parse --short HEAD)"
            out="$(python3 "$GITHUB_WORKSPACE/hub-repo/tools/ci/vendored_pins.py" ahead "$CONSUMER/$file" \
              --owner-dir "$dir" --owner-ref "$REF@$head")"
            if [ -n "$out" ]; then rows+="$out"$'\n'; fi
          done 3< "$RUNNER_TEMP/pins.tsv"
          {
            echo "### Vendored copies and their owners' \`$REF\`"
            echo
            if [ -z "$rows" ]; then
              echo "Every copy matches its owner's \`$REF\`."
            else
              echo "The owners changed these files after the commit this repository adopted. Adopting the change"
              echo "is a pull request here (docs/shared_components.md in atrium-project); nothing is failing."
              echo
              echo "| Copy | Owner | Owner path | State |"
              echo "|---|---|---|---|"
              printf '%s' "$rows"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
