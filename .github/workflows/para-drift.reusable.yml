name: Paradata Drift Check
on:
  workflow_call:
    inputs:
      hub-ref:
        description: >-
          Ref to read the canonical docs/templates/shared/* files from. Keep this
          in step with the ref THIS workflow is called at, or the check compares
          against the wrong generation of templates.

          Was hardcoded to `test` (#18). That left the pinning half-done: with
          callers on the immutable `@v1`, the workflow LOGIC came from the tag
          while the FILES it enforces still came from a mutable branch — so any
          push to `test` still changed what every pinned caller enforced, which
          defeats the pin for the one reusable whose whole job is comparing files.

          Callers on the `@test` pre-release channel should pass `hub-ref: test`
          to stay self-consistent.
        required: false
        type: string
        default: v1
      vendored-from:
        description: >-
          Space-separated ufal repositories this caller vendors files from with SHA pins, in
          tests/test_vendored_*_parity.py (atrium-project#72 B: the tool-to-tool shared layers,
          e.g. digital-convert's copy of nlp-enrich's TEITOK reader). When set, the vendored-parity
          job clones each owner beside the caller at vendored-ref and runs the pin tests, whose
          sibling half then compares every copy byte for byte with the owner's current file: a
          copy that fell behind its owner turns red here, in the consumer. Empty (the default)
          skips the job.
        required: false
        type: string
        default: ""
      vendored-ref:
        description: >-
          The owners' ref the copies are compared with. `test`, the integration branch, so a
          change in the owner shows in the consumer before either releases.
        required: false
        type: string
        default: test
      vendored-tests:
        description: The pin tests to run, as a shell glob relative to the caller's root.
        required: false
        type: string
        default: tests/test_vendored_*_parity.py

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  drift-check:
    name: Verify Canonical Paradata Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller tool repository
        uses: actions/checkout@v7
        with:
          path: tool-repo

      - name: Checkout ATRIUM hub repository
        uses: actions/checkout@v7
        with:
          repository: ufal/atrium-project
          ref: ${{ inputs.hub-ref }}
          path: hub-repo


      - name: Verify canonical shared files (atrium-project#59)
        # One loop over docs/templates/shared/MANIFEST.json instead of sixteen
        # near-identical `diff -u` steps hand-written one per file (roadmap D5:
        # "seven near-identical diff -u steps ... over a hardcoded file list").
        # tools/shared_manifest.py is the manifest's one reader -- scripts/
        # revendor_shared.sh and tools/skill_drift_check.py both use it too, via
        # the same --tsv CLI shape this step uses, so this step, that script and
        # that tool cannot drift relative to each other the way the sixteen
        # hand-written steps below this comment (in every commit before this one)
        # drifted from tools/skill_drift_check.py's SHARED_FILES tuple for weeks
        # (atrium-project#59). Every entry the manifest names -- byte-parity
        # always, and a `--selftest` run on the VENDORED copy for the two entries
        # (atrium_vocab.py, atrium_rocrate.py) the manifest marks selftest: true,
        # exactly as scripts/revendor_shared.sh runs them.
        #
        # Adding a canonical file is now one row in the manifest -- see that
        # file's own header comment for what used to be four hand-edits instead.
        run: |
          set -euo pipefail
          fail=0
          while IFS=$'\t' read -r canonical dest selftest _precondition; do
            src="hub-repo/docs/templates/shared/$canonical"
            dst="tool-repo/$dest"
            echo "::group::$dest"
            if [ ! -f "$dst" ]; then
              echo "MISSING: tool-repo has no $dest"
              fail=1
              echo "::endgroup::"
              continue
            fi
            if ! diff -u "$dst" "$src"; then
              echo "MISMATCH: $dest differs from the canonical $canonical"
              fail=1
            else
              echo "ok: $dest matches the canonical $canonical"
            fi
            if [ "$selftest" = "1" ]; then
              echo "-- self-test: python3 $dst --selftest"
              if ! python3 "$dst" --selftest; then
                echo "SELFTEST FAILED: $dest"
                fail=1
              fi
            fi
            echo "::endgroup::"
          done < <(python3 hub-repo/tools/shared_manifest.py --tsv hub-repo/docs/templates/shared/MANIFEST.json)
          exit "$fail"

  vendored-parity:
    # atrium-project#72 B: para-drift over the tool-to-tool layers. The hub-canonical files above
    # are compared with the hub; a layer one tool owns and another vendors (the TEITOK reader
    # today; the document reader and the record renderer after the repository moves) is compared
    # with its owner, by the pin tests the consumer already has. Those tests skip their sibling
    # comparison when the owner is not checked out beside the consumer, which is what they do
    # in every other CI job; here it is, so a skip is a failure.
    name: Verify Vendored Copies Against Their Owners
    if: inputs.vendored-from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller tool repository
        uses: actions/checkout@v7
        with:
          # The pin tests find their owner at ../<owner>, so both sit side by side under work/.
          path: work/${{ github.event.repository.name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Clone the owners beside it
        env:
          OWNERS: ${{ inputs.vendored-from }}
          REF: ${{ inputs.vendored-ref }}
        run: |
          set -euo pipefail
          for owner in $OWNERS; do
            case "$owner" in
              *[!A-Za-z0-9._-]*) echo "::error::vendored-from: '$owner' is not a repository name"; exit 1 ;;
            esac
            git clone --quiet --depth 1 --branch "$REF" "https://github.com/ufal/$owner.git" "work/$owner"
            echo "$owner @ $REF = $(git -C "work/$owner" rev-parse --short HEAD)"
          done

      - name: Run the pin tests; a skipped sibling comparison fails
        working-directory: work/${{ github.event.repository.name }}
        env:
          TESTS: ${{ inputs.vendored-tests }}
        run: |
          set -euo pipefail
          pip install --quiet pytest
          shopt -s nullglob
          # shellcheck disable=SC2206 — TESTS is a glob, expanded here on purpose
          files=( $TESTS )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no pin tests match '$TESTS'"
            exit 1
          fi
          python -m pytest -rs -p no:cacheprovider "${files[@]}" | tee "$RUNNER_TEMP/pins.log"
          if grep -q '^SKIPPED' "$RUNNER_TEMP/pins.log"; then
            echo "::error::a pin test skipped its comparison with the owner: the owner checkout is not where the test looks"
            exit 1
          fi
