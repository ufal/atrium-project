# ATRIUM — Security & supply-chain reusable workflow (TEMPLATE)
#
# Second reusable workflow (sibling to docker-tool.reusable.yml). Bundles the
# checks that are *identical* across the five tool repos so they stay DRY:
#   1. version-check  — CITATION.cff == para_config.txt [tool] version (== git tag on tag push)
#   2. image-scan     — Trivy CVE scan of the published GHCR image -> SARIF in the Security tab
# (The third job, `sbom`, was removed on 2026-07-30: the SBOM is now a buildkit
# attestation pushed with the image by docker-tool.reusable.yml — see §3 below.)
#
# Host this once in ufal/atrium-project/.github/workflows/ and call it from each
# repo with a ~15-line caller (see security.caller.example.yml).
#
# NOTE: action versions match the Node-24 baseline already used by
# docker-tool.reusable.yml, and tools/ci/workflow_lint.py holds them at that floor.
# The write-scoped action here (trivy-action) is pinned by commit SHA with a
# `# vX` comment the linter verifies — see the comments on the Trivy step.

name: ATRIUM Security Template

on:
  workflow_call:
    inputs:
      image-ref:
        description: "Image to scan, e.g. ghcr.io/ufal/atrium-translator:latest. Leave empty to skip the image scan."
        required: false
        type: string
        default: ""
      citation-path:
        required: false
        type: string
        default: "CITATION.cff"
      para-config-path:
        required: false
        type: string
        default: "para_config.txt"   # repos with a setup/ layout (page-classification, ocr-postprocess) pass setup/para_config.txt

jobs:
  # --- 1. Version consistency (cheap, no image needed) -------------------------
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least privilege, matching `image-scan` below (issue #10, G8). A reusable
    # workflow's jobs inherit the CALLER's default token scope when they declare
    # nothing, so an unscoped job silently runs at whatever the consuming repo
    # happens to grant. This job only reads the tree to compare version strings.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check CITATION.cff <-> para_config <-> tag
        # Runs the CALLER's vendored check_version.py — the same script its
        # release.yml uses, held byte-identical to
        # docs/templates/shared/check_version.py by para-drift.reusable.yml.
        # This used to be a ~35-line inline heredoc here that had already drifted
        # from the near-identical copies in the five release.yml files (#18).
        #
        # No --require-tag: this runs on pushes and PRs too, where there is no tag
        # and only the CITATION/para_config agreement is meaningful.
        env:
          CITATION_PATH: ${{ inputs.citation-path }}
          PARA_PATH: ${{ inputs.para-config-path }}
          # Only set on a v* tag push; empty otherwise:
          TAG_REF: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python check_version.py \
            --citation "$CITATION_PATH" \
            --para-config "$PARA_PATH" \
            --tag "$TAG_REF"

  # --- 2. Container image vulnerability scan (PERIODIC re-scan) -----------------
  image-scan:
    # Deliberately NOT on tag/release. Publishing happens in docker-tool.reusable.yml,
    # a separate workflow, so scanning `:latest` on the tag-push event raced the push
    # and could scan the previous image or fail to pull (#18, 2026-07-29 audit). The
    # post-publish scan now lives next to the push and addresses the image by digest.
    #
    # This job's remaining job is the one it is actually good at: periodically
    # re-scanning the CURRENT published image, because new CVEs are disclosed
    # against images that have not changed.
    if: inputs.image-ref != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write   # required to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v7

      - name: Trivy scan (image -> SARIF)
        id: scan
        # SECURITY: aquasecurity/trivy-action tags <= 0.34.2 were compromised in the
        # 2026-03-19 supply-chain incident (GHSA-69fq-xp46-6x23) — 76/77 tags were
        # force-pushed to credential-stealing malware. Remediation re-published the
        # legitimate tags WITH a "v" prefix, so the bare "0.36.0" no longer resolves;
        # the tag is "v0.36.0". Use >= v0.35.0 (protected by GitHub immutable releases)
        # and ideally pin to that release's commit SHA. Latest tag is verified at
        # https://github.com/aquasecurity/trivy-action/releases
        #
        # NOW SHA-PINNED (#18, 2026-07-31) — the "ideally" above is done. v0.36.0 is
        # an ANNOTATED tag, so this is the dereferenced commit
        # (`git ls-remote 'refs/tags/v0.36.0^{}'`), not the tag object; pinning the
        # tag-object SHA silently does not work.
        #
        # This file was the one place the 2026-07-31 pinning pass missed, which is
        # why workflow-lint.yml now checks it on every push rather than by hand.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          # Trivy itself: the action installs 0.70.0 by default, and that Trivy logged "Version
          # 0.76.1 of Trivy is now available" on every scan (2026-11-02).
          version: v0.76.1
          image-ref: ${{ inputs.image-ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # report-only; set to "1" to FAIL the build on CRITICAL/HIGH
        # Report-only, so a failure here is Trivy failing to run: its DB download (mirror.gcr.io
        # answered 404 on 2026-10-26 and failed this scan in two repositories) or its own
        # download (exit 6, 2026-11-04). After a pause, the retry runs once from ghcr.io, not
        # continue-on-error. History:
        # docs/decisions/docker-tool-reusable.md#trivy-db-retry
        # ci-optional: after a 30 s pause, the retry runs once from ghcr.io, without continue-on-error
        continue-on-error: true

      - name: Wait before retrying Trivy
        # The first scan can also fail on Trivy's own download, before any DB: on 2026-11-04 the
        # binary download exited 6 (host not resolved) on the scan and again on the retry one
        # second later (translator v1.7.3-beta, run 41809705322); the next job installed the same
        # Trivy 13 s after. A short pause lets a transient DNS or network fault pass. History:
        # docs/decisions/docker-tool-reusable.md#trivy-db-retry
        if: steps.scan.outcome == 'failure'
        run: sleep 30

      - name: Trivy scan (image -> SARIF; retry from ghcr.io after a DB download failure)
        if: steps.scan.outcome == 'failure'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
        with:
          version: v0.76.1   # as on the first scan
          image-ref: ${{ inputs.image-ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Count CRITICAL and HIGH findings in the job summary (report-only)
        # The scan's findings otherwise reach only code scanning. Trivy's SARIF holds every
        # severity whatever `severity:` says ("Building SARIF report with all severities"), so this
        # counts each result by its rule's severity tag, then lists the CRITICAL and HIGH ones
        # (ID, package, installed and fixed version; the first 20). Never fails the job.
        if: always() && hashFiles('trivy-results.sarif') != ''
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          python3 - <<'PY'
          import collections, json, os, re

          def field(text, name):
              # Trivy writes each finding's message as "Package: …", "Installed Version: …", … lines.
              match = re.search(rf"^{name}: (.+)$", text, re.M)
              return match.group(1).strip() if match else "?"

          counts = collections.Counter()
          found = []
          with open("trivy-results.sarif", encoding="utf-8") as fh:
              sarif = json.load(fh)
          for run in sarif.get("runs", []):
              severity = {}
              for rule in run.get("tool", {}).get("driver", {}).get("rules", []):
                  tags = rule.get("properties", {}).get("tags", [])
                  severity[rule.get("id")] = next((t for t in tags if t in ("CRITICAL", "HIGH")), "other")
              for result in run.get("results", []):
                  level = severity.get(result.get("ruleId"), "other")
                  counts[level] += 1
                  if level != "other":
                      text = result.get("message", {}).get("text", "")
                      found.append((level, result.get("ruleId", "?"), field(text, "Package"),
                                    field(text, "Installed Version"), field(text, "Fixed Version")))
          found.sort(key=lambda f: (f[0] != "CRITICAL", f[2], f[1]))
          lines = [
              f"### Trivy: `{os.environ['IMAGE_REF']}`",
              "",
              "| Severity | Fixable findings |",
              "|----------|------------------|",
              f"| CRITICAL | {counts['CRITICAL']} |",
              f"| HIGH     | {counts['HIGH']} |",
          ]
          if found:
              lines += ["", "| Severity | ID | Package | Installed | Fixed in |", "|---|---|---|---|---|"]
              lines += [f"| {s} | {i} | `{p}` | {v} | {fx} |" for s, i, p, v, fx in found[:20]]
              if len(found) > 20:
                  lines += ["", f"{len(found) - 20} more in code scanning."]
          lines += ["", "Report-only; every finding is also in code scanning."]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4   # Node 24; v3 deprecates Dec 2026
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  # --- 3. SBOM — REMOVED (2026-07-30, #18) --------------------------------------
  # This job generated an SPDX SBOM with anchore/sbom-action@v0 and kept it as a
  # workflow artifact. Both halves of that are now better handled elsewhere:
  #
  #   * The release SBOM is a buildkit attestation pushed WITH the image
  #     (`sbom: true` + `provenance: true` on docker-tool.reusable.yml's build
  #     step). It cannot race the publish, is addressed by digest, and is
  #     readable via `docker buildx imagetools inspect` / syft / cosign — no
  #     workflow artifact to go looking for.
  #   * `@v0` was the last floating major-zero third-party pin in the ecosystem,
  #     i.e. an unpinned supply-chain dependency holding registry read access, in
  #     a file whose own Trivy comment argues for SHA pinning.
  #
  # Nothing references this job by name, so removing it is caller-compatible.
