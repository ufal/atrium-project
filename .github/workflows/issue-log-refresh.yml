# atrium-project — regenerate the agent_dev_logs/issues/ markdown snapshots.
#
# Replaces the local update_issues.sh that carried a personal token inline
# (#18, 2026-07-27). Opens a PR containing only the generated files.
#
# Three defects fixed in the 2026-07-29 audit pass — each of them would have
# failed this workflow on its first real run:
#   1. No `permissions:` block. peter-evans/create-pull-request needs
#      contents:write + pull-requests:write; the default token could not push
#      the branch or open the PR.
#   2. The token was exported as GH_TOKEN. gh2md reads GITHUB_ACCESS_TOKEN
#      (gh2md.py:20) and nothing else, so it saw no credentials at all.
#   3. `gh2md ufal/atrium-project > out.md` — gh2md takes `output_path` as a
#      POSITIONAL argument (`gh2md repo output_path`), so the redirect form
#      exits with "the following arguments are required: output_path".
#
# ── 2026-08-18: the first scheduled run happened, and failed twice over ───────
# Run 32000451964 (Monday 06:00 UTC) is the first time any of the above was
# exercised. Both of its failures were structural, not environmental:
#
#   4. `mkdir -p agent_dev_logs/issues` then `gh2md … agent_dev_logs/issues`
#      is unconditionally fatal. gh2md's own entry point refuses a non-empty
#      output directory BEFORE it authenticates or fetches anything:
#
#          if args.use_multiple_files:
#              if os.path.exists(args.output_path):
#                  if len(os.listdir(args.output_path)):
#                      raise RuntimeError(
#                          f"Output directory already exists and has files in it: …")
#          — gh2md 2.5.1, gh2md.py:865-869
#
#      `agent_dev_logs/issues/` is TRACKED and has carried 16 files since March,
#      so the checkout guarantees the directory is non-empty on every single run.
#      This could never have succeeded — not on a dry run, not on a real one, and
#      not with a perfectly valid token. The export now goes to a scratch
#      directory outside the tree and the tracked directory is REPLACED with it.
#
#   5. The failure handler could not report the failure. `permissions:` granted
#      contents:write + pull-requests:write only, and a `permissions:` block is
#      exhaustive — every scope it omits is set to `none`, not left at the
#      repository default. So `issues.create` came back
#      `403 Resource not accessible by integration` (`x-accepted-github-permissions:
#      issues=write`) and the escalation path this workflow added specifically so
#      that an unattended Monday failure would be visible… itself failed silently,
#      turning one red run into two. e2e-pipeline-smoke.yml and
#      e2e-digital-smoke.yml both already grant `issues: write` for exactly this.
#
# Replacing rather than merging the export directory also retires the manual
# cleanup the PR body used to ask for: gh2md encodes issue state in the FILENAME
# (`…issue.open.md` -> `…issue.closed.md`), so a merge-in-place leaves the
# pre-transition file behind forever. A wholesale swap cannot.

name: Refresh Issue Logs

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: >-
          Report the export diff to the Step Summary WITHOUT opening a PR. Use this
          for the first manual run: the fixes above have never produced a green run
          (the only recorded run, 32000451964, died in the export step), and the
          schedule below fires this unattended while holding contents:write +
          pull-requests:write and a repo secret. Prove it works before it can open
          anything.
        type: boolean
        default: false
  release:
    types: [published]
  # Issue #10, G9: this workflow had NEVER run — 0 recorded runs since it was
  # created 2026-07-28. Its two triggers could not fire it: `workflow_dispatch`
  # was never invoked, and the hub is the standards/CI repo, so it does not cut
  # its own GitHub releases — `release: published` is structurally unreachable
  # here. The three defects fixed in the 07-29 audit above therefore stayed
  # unexercised, and the issue exports kept being produced by the local
  # `update_issues.sh` and the personal token this workflow exists to retire.
  # A weekly schedule gives it a real trigger; Monday 06:00 UTC lands before the
  # week's first working session.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write        # create-pull-request pushes the docs/issue-log-update branch
  pull-requests: write   # ...and opens the PR from it
  # Defect 5 above. A `permissions:` block is exhaustive — omitting `issues`
  # sets it to `none`, which 403s the scheduled-failure handler at the bottom
  # of this file. It also covers gh2md's read of this repository's issues when
  # the run falls back to GITHUB_TOKEN.
  issues: write

concurrency:
  group: issue-log-refresh
  cancel-in-progress: false

jobs:
  refresh-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install gh2md
        run: pip install gh2md

      - name: Generate Markdown Logs
        env:
          # gh2md resolves credentials from GITHUB_ACCESS_TOKEN only.
          #
          # GH2MD_READ_ACCESS stays the preferred credential (a scoped read token,
          # which is what lets this export ever widen beyond the current repo), but
          # it is no longer REQUIRED. An unset or expired secret evaluates to the
          # empty string, and `||` then falls through to the job's own GITHUB_TOKEN
          # — which, with `issues: write` granted above, can read this repository's
          # issues perfectly well. Before this, a lapsed secret produced an opaque
          # GraphQL auth error on an unattended Monday.
          GITHUB_ACCESS_TOKEN: ${{ secrets.GH2MD_READ_ACCESS || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${{ secrets.GH2MD_READ_ACCESS }}" ]; then
            echo "::notice::Exporting with GH2MD_READ_ACCESS."
          else
            echo "::notice::GH2MD_READ_ACCESS is not set — falling back to GITHUB_TOKEN (this repository only)."
          fi

          # Defect 4: gh2md refuses to write into a directory that already has
          # files in it, and agent_dev_logs/issues is tracked, so it is never
          # empty after a checkout. Export somewhere else entirely.
          #
          # --multiple-files writes one file per issue, named
          #   {created:%Y-%m-%d}.{number}.{issue|pr}.{state}.md
          # which is exactly the existing agent_dev_logs/issues/ convention
          # (e.g. 2026-05-27.18.issue.open.md).
          #
          # NOT --idempotent-paths: that switches the naming to issues/{number}.md
          # and would rewrite every committed filename.
          # `${GITHUB_REPOSITORY}`, not a hardcoded `ufal/atrium-project`: this
          # workflow is published as a pattern, and a hardcoded slug in a forked or
          # renamed repo exports SOMEONE ELSE'S issues into this repo's PR.
          EXPORT_DIR="$(mktemp -d)/issues"
          gh2md "${GITHUB_REPOSITORY}" "$EXPORT_DIR" --multiple-files --no-prs

          # Guard before the destructive step. gh2md deletes its own output
          # directory when it processed no issues (`os.rmdir(output_path)`,
          # gh2md.py:693), and a partial or empty export must never reach the
          # swap below — `rm -rf` on the tracked directory followed by an empty
          # replacement would open a PR that DELETES all 16 committed logs and
          # look, in the diff, exactly like a deliberate cleanup.
          if [ ! -d "$EXPORT_DIR" ] || [ -z "$(ls -A "$EXPORT_DIR" 2>/dev/null)" ]; then
            echo "::error::gh2md exported no files to $EXPORT_DIR — refusing to replace agent_dev_logs/issues with an empty export."
            exit 1
          fi

          echo "Exported $(find "$EXPORT_DIR" -type f -name '*.md' | wc -l) issue file(s)."

          # Replace, do not merge. gh2md encodes issue state in the filename, so
          # an issue closed since the last run lands under a NEW name
          # (`…issue.open.md` -> `…issue.closed.md`) while the old file survives
          # a merge untouched. Swapping the whole directory retires that stale
          # file automatically, which is the manual step the PR body used to
          # instruct a human to perform.
          rm -rf agent_dev_logs/issues
          mkdir -p agent_dev_logs
          mv "$EXPORT_DIR" agent_dev_logs/issues

      # W7: the dry-run leg. Reports what WOULD change and stops, so the first real
      # invocation of a workflow that has never run green can be observed without it
      # opening a PR.
      - name: Report the export diff (dry run)
        if: inputs.dry-run
        run: |
          set -uo pipefail
          {
            echo "### Issue log refresh — DRY RUN"
            echo ""
            echo "No pull request was opened. Below is what a real run would commit."
            echo ""
            echo '```text'
            git status --porcelain agent_dev_logs/issues || true
            echo '```'
            echo ""
            echo "Files changed: $(git status --porcelain agent_dev_logs/issues | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request
        if: ${{ !inputs.dry-run }}
        # SHA-pinned: this action runs with contents:write + pull-requests:write
        # (see the permissions block above), so a force-pushed tag would run
        # attacker code holding both. Dependabot keeps the SHA and the version
        # comment current (#18).
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: refresh issue logs via gh2md"
          title: "docs: Automated Issue Log Refresh"
          branch: "docs/issue-log-update"
          add-paths: agent_dev_logs/issues
          body: |
            Automated refresh of the `agent_dev_logs/issues/` markdown snapshots via `gh2md`.

            The export directory is replaced wholesale rather than merged, so an issue
            that changed state since the last run (`…issue.open.md` -> `…issue.closed.md`)
            no longer leaves its pre-transition file behind. Deletions in this diff are
            that rename's other half, not lost history.

      # W7: every other scheduled workflow in this ecosystem opens an issue when it
      # fails on a schedule (e2e-pipeline-smoke.yml and all five scheduled-smoke.yml
      # do). This one did not — so an unattended Monday failure of a workflow holding
      # contents:write, pull-requests:write and a repo secret would have been visible
      # only to whoever thought to check the Actions tab. A scheduled job with no
      # failure path is a job that fails silently by design.
      #
      # 2026-08-18: it had a failure path and it 403'd (defect 5 above). Two changes:
      # `issues: write` in the permissions block, and the de-duplication below.
      # A weekly cron with an unconditional `issues.create` files a fresh issue every
      # Monday for as long as the breakage lasts; the same pattern on
      # e2e-digital-smoke.yml's 3-day cron is what produced #45. One open issue per
      # ongoing breakage, updated in place, is the reportable unit — not one per run.
      - name: Open an issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            // Marker in the body, not a title match: the title carries a date and
            // therefore differs on every run, which is precisely why the naive
            // version duplicates.
            const MARKER = '<!-- atrium:issue-log-refresh-failure -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              MARKER,
              'The scheduled `issue-log-refresh.yml` run failed:',
              runUrl,
              '',
              'Likely causes, in the order they have actually bitten:',
              '- The export step tried to write into a non-empty `agent_dev_logs/issues`',
              '  (gh2md refuses that outright). Fixed 2026-08-18 — a recurrence means the',
              '  scratch-directory export was reverted.',
              '- `GH2MD_READ_ACCESS` expired or was revoked AND the GITHUB_TOKEN fallback',
              '  was also refused (gh2md reads *only* `GITHUB_ACCESS_TOKEN`).',
              '- A gh2md release changed the positional `output_path` CLI contract.',
              '- `peter-evans/create-pull-request` could not push `docs/issue-log-update`.',
              '',
              'Until this is fixed the issue exports are stale, and the local',
              '`update_issues.sh` + personal token this workflow exists to retire is',
              'the only thing keeping them current.',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci',
              per_page: 100,
            });
            const open = existing.find((i) => !i.pull_request && (i.body || '').includes(MARKER));

            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)}: ${runUrl}`,
              });
              core.notice(`Commented on existing failure issue #${open.number} instead of opening a duplicate.`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Issue log refresh failed (${new Date().toISOString().slice(0, 10)})`,
              body,
              labels: ['ci'],
            });
            core.notice(`Opened failure issue #${created.data.number}.`);
