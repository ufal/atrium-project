name: E2E Pipeline Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Nightly run to catch cross-repo drift

jobs:
  e2e-json-thread:
    runs-on: ubuntu-latest
    permissions:
      packages: read  # Required to dynamically pull the latest ghcr.io images
      contents: read

    steps:
      - name: Checkout ATRIUM Hub Repository
        uses: actions/checkout@v4

      - name: Set up Python for Assertions
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Output Directory
        run: mkdir -p ${{ github.workspace }}/e2e_out

      # 1. Page Classification (pc) -> Initialize JSON
      - name: Stage 1 - Page Classification
        run: >
          docker run --rm -v ${{ github.workspace }}:/workspace 
          ghcr.io/ufal/atrium-page-classification:latest 
          --input /workspace/fixtures/e2e/ALTO/CTX000000001.alto.xml 
          --output /workspace/e2e_out/1_pc.json

      # 2. ALTO Postprocess (alto) -> Merge Blocks
      - name: Stage 2 - ALTO Postprocess
        run: >
          docker run --rm -v ${{ github.workspace }}:/workspace 
          ghcr.io/ufal/atrium-alto-postprocess:latest 
          --input /workspace/e2e_out/1_pc.json 
          --output /workspace/e2e_out/2_alto.json

      # 3. Translator -> Write Translation Schema
      - name: Stage 3 - Translator
        run: >
          docker run --rm -v ${{ github.workspace }}:/workspace 
          ghcr.io/ufal/atrium-translator:latest 
          --input /workspace/e2e_out/2_alto.json 
          --output /workspace/e2e_out/3_translate.json

      # 4. NLP Enrich -> Append CoNLL-U Entities
      - name: Stage 4 - NLP Enrich
        run: >
          docker run --rm -v ${{ github.workspace }}:/workspace 
          ghcr.io/ufal/atrium-nlp-enrich:latest 
          --input /workspace/e2e_out/3_translate.json 
          --output /workspace/e2e_out/4_nlp.json

      # 5. LLM Enrich -> Markdown Generation
      - name: Stage 5 - LLM Enrich
        run: >
          docker run --rm -v ${{ github.workspace }}:/workspace 
          ghcr.io/ufal/atrium-llm-enrich:latest 
          --input /workspace/e2e_out/4_nlp.json 
          --output /workspace/e2e_out/5_llm.json

      # Final Validation -> Enforce API Contract
      - name: Assert Final Document Contract
        run: |
          pip install -r tools/e2e/requirements.txt
          python tools/e2e/e2e_assert.py e2e_out/5_llm.json

      # Artifact the final JSON for debugging if the assertion fails
      - name: Upload Pipeline Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pipeline-outputs
          path: e2e_out/*.json