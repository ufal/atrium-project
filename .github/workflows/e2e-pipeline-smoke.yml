# Reusable: atrium-project — end-to-end pipeline integration smoke test
name: Reusable E2E Pipeline Smoke Test

on:
  workflow_call:
    inputs:
      openrouter-model:
        description: "OpenRouter model slug for the llm stage"
        default: "openai/gpt-4o-mini"
        type: string
        required: false
      image-tag:
        description: >-
          GHCR tag every stage runs. `latest` is the RELEASED image set;
          `test` tracks each repo's test branch. See the note below.
        default: "latest"
        type: string
        required: false
    secrets:
      OPENROUTER_KEY:
        description: "OpenRouter API Key for the LLM enrichment stage"
        required: false
  workflow_dispatch:
    inputs:
      image-tag:
        description: "GHCR tag to run (latest = released, test = current test branches)"
        default: "latest"
        type: string
        required: false
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 */3 * *' # Runs at 02:00 on every 3rd day-of-month

# ⚠️ WHAT THIS RUN IS ACTUALLY TESTING (issue #10)
#
# The stages below are PUBLISHED CONTAINER IMAGES, and `docker-tool.reusable.yml` moves
# `:latest` only on a version-tag push:
#     type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
# A branch push publishes `sha-*` and `:test`, but never `:latest`.
#
# NOTE (corrected 2026-08-06): issue #10 added the `:test` TAG RULE, but until the
# `build-and-push` job gate was widened in the same round, that rule could never fire —
# the job ran only on `refs/tags/v*` or a `release` event, and `type=raw,value=test` is
# enabled only when `github.ref == 'refs/heads/test'`. The two conditions are mutually
# exclusive, so a branch push published NOTHING AT ALL, not even `sha-*` (that tag rule
# lives in the same job). Six green `test` pushes in llm-enrich on 2026-08-06 produced no
# image. The gate now includes `push` to `refs/heads/test`, which is what makes both this
# line and the `sha-<short>` claim below true.
#
# So with `image-tag: latest` this workflow validates THE LAST RELEASE of each tool, while
# being triggered by hub pushes and a cron. A defect it finds cannot be cleared by fixing
# the source: the owning repo has to cut a release before this can go green. That is not a
# flaw in the gate — it is the gate correctly reporting what is deployed — but it must be
# read that way, or a red run looks like "the pipeline is broken" when it means "the
# released images are older than the fix".
#
# Demonstrated 2026-08-06 (run 31075185518): the schema gate rejected
# `entities[].type_cnec: null` from nlp-enrich. The fix was already on `test`; `:latest`
# still pointed at the pre-fix v0.18.2, so no source change could have greened the run.
#
# Pass `image-tag: test` (workflow_dispatch) to validate what is about to be released
# instead. Flipping the DEFAULT to `test` is deliberately not done here: `:test` starts
# being published only once each repo has pushed a branch commit under the issue #10
# docker-tool change, so the tag does not exist for every repo yet. Flip it once
# `docker pull ghcr.io/ufal/atrium-<tool>:test` succeeds for all five.

concurrency:
  group: e2e-pipeline-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  E2E_DOC: CTX000000003

jobs:
  e2e-json-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      packages: read
      contents: read
      issues: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
      OPENROUTER_MODEL: ${{ inputs.openrouter-model || 'openai/gpt-4o-mini' }}

    steps:
      # NOT `repository: ufal/atrium-project` + `ref: v1`, which is what this step did
      # until 2026-09-11 — the same defect e2e-digital-smoke.yml removed on 2026-08-18
      # and recorded at length above its own checkout. This workflow LIVES in the hub,
      # so the default checkout already gives the hub AT THE COMMIT BEING TESTED.
      # Pinning it meant the workflow file came from the ref being run while
      # `fixtures/e2e/` and `tools/e2e/e2e_assert.py` came from wherever `v1` pointed:
      # a self-referencing checkout validated by tooling other than the tooling that
      # ships with it, which is exactly what a smoke test must not do.
      #
      # It failed loudly once the `v1` tag was deleted (run 34591132140 — the fetch of
      # `+refs/tags/v1*` matched nothing and checkout exited 1). That is the good
      # outcome: a latent version skew surfaced as a hard error instead of quietly
      # asserting today's pipeline against a tag's fixtures.
      #
      # Same reasoning codeql.yml and pre-commit.yml already record for preferring
      # `uses: ./…` over `@v1`.
      - name: Checkout ATRIUM Hub Repository
        uses: actions/checkout@v7

      - name: Set up Python for Assertions
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/e2e/requirements.txt

      - name: Install e2e tooling dependencies
        run: pip install -r tools/e2e/requirements.txt

      - name: Gate on OPENROUTER_KEY
        id: gate
        run: |
          if [ -n "${OPENROUTER_API_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::llm stage (Stage 5) skipped — OPENROUTER_KEY secret is not set."
          fi

      - name: Require the secret on scheduled runs
        if: steps.gate.outputs.enabled != 'true' && github.event_name == 'schedule'
        run: |
          echo "::error::OPENROUTER_KEY is not set — the nightly E2E cannot exercise Stage 5 (llm-enrich)."
          echo "::error::Add the OPENROUTER_KEY repository secret, or move this workflow off the schedule trigger."
          exit 1

      - name: Create workspace
        run: |
          W="${{ github.workspace }}/work"
          mkdir -p "$W/input" "$W/ALTO" "$W/PAGE_ALTO" "$W/DOC_LINE_CATEG" \
                   "$W/translated" "$W/nlp_out" "$W/llm_out" "$W/doc_json" "$W/paradata"
          cp "fixtures/e2e/ALTO/${E2E_DOC}.alto.xml" "$W/ALTO/"
          cp "fixtures/e2e/DOC_LINE_CATEG/${E2E_DOC}.csv" "$W/DOC_LINE_CATEG/"
          chmod -R a+rwX "$W"

      - name: Render fixture page image from the ALTO
        run: |
          python3 tools/e2e/render_alto_page.py \
            "fixtures/e2e/ALTO/${E2E_DOC}.alto.xml" \
            --out "${{ github.workspace }}/work/input/${E2E_DOC}-1.png"

      - name: Write alto-postprocess e2e config
        run: |
          W="${{ github.workspace }}/work"
          cat > "$W/config_e2e_alto.txt" <<EOF
          [PIPELINE]
          METHOD = alto-tools
          INPUT_DIR = /workspace/work/ALTO
          PAGE_ALTO_DIR = /workspace/work/PAGE_ALTO
          PARADATA_DIR = /workspace/work/paradata
          SKIP_CLASSIFY = true
          SKIP_AGGREGATE = true

          [EXTRACT]
          INPUT_CSV = /workspace/work/e2e_alto_stats.csv
          OUTPUT_TXT = /workspace/work/PAGE_TXT
          EOF

      - name: Write nlp-enrich e2e config
        run: |
          W="${{ github.workspace }}/work"
          cat > "$W/config_e2e_nlp.txt" <<EOF
          OUTPUT_DIR="/workspace/work/nlp_out"
          INPUT_TABLES_DIR="/workspace/work/DOC_LINE_CATEG"
          WORK_DIR="/workspace/work/TEMP"
          LOG_FILE="/workspace/work/nlp_out/processing.log"
          CONLLU_INPUT_DIR="/workspace/work/nlp_out/UDP"
          TEMP_TXT_DIR="/workspace/work/TEMP/TXT_EXTRACT"
          CHUNK_DIR="/workspace/work/TEMP/CHUNKS"
          TSV_INPUT_DIR="/workspace/work/nlp_out/NE"
          SUMMARY_OUTPUT_DIR="/workspace/work/nlp_out/UDP_NE"
          TEITOK_OUTPUT_DIR="/workspace/work/nlp_out/TEITOK"
          INPUT_ALTO_DIR="/workspace/work/ALTO"
          PARADATA_DIR="/workspace/work/nlp_out/paradata"
          UDPIPE_URL="https://lindat.mff.cuni.cz/services/udpipe/api/process"
          NAMETAG_URL="https://lindat.mff.cuni.cz/services/nametag/api/recognize"
          MODEL_UDPIPE="czech-pdt-ud-2.15-241121"
          MODEL_NAMETAG="nametag3-multilingual-onto-260521"
          TIMEOUT=60
          MAX_RETRIES=5
          BACKOFF_FACTOR=1.5
          WORD_CHUNK_LIMIT=900
          SAVE_CSV=true
          SAVE_CONLLU_NE=true
          SAVE_TEITOK=false
          FAIL_ON_EMPTY=true
          EOF

      # ── Stage 5 vocabulary (2026-08-19) ────────────────────────────────────
      # Points at llm-enrich's OWN committed vocabulary in the checkout Stage 5
      # already mounts and runs from, rather than a fixture copy of it here.
      #
      # This step used to write a QUOTED path to a hub-side copy, and both halves
      # were wrong (run 32208408456):
      #
      #   * llm-enrich's load_config kept the quote characters, so the path could
      #     not exist. VocabularyManager fell through to a live AMCR harvest whose
      #     terms all land in the "Other" theme — which is withheld from the
      #     prompt — leaving a one-value enum that rejected every correct answer
      #     the model gave. The run enriched nothing and still exited 0.
      #   * the fixture had gone stale. llm-enrich replaced
      #     data_samples/teater_nested_vocab.json with a built union of AMCR and
      #     TEATER under data_samples/vocab/, so the hub copy no longer matched
      #     the vocabulary the tool actually ships.
      #
      # llm-enrich now strips quotes and refuses to auto-sync, so either fix alone
      # is sufficient; sourcing the vocabulary from the tool repo is what stops it
      # drifting again, since there is no second copy to keep in step. Unquoted
      # deliberately — these configs are shell-flavoured KEY=VALUE, not shell.
      - name: Write llm-enrich e2e config
        if: steps.gate.outputs.enabled == 'true'
        run: |
          W="${{ github.workspace }}/work"
          VOCAB=/workspace/work/atrium-llm-enrich-main/data_samples/vocab/union_nested.json
          echo "VOCAB_PATH=$VOCAB" > "$W/llm_config.txt"

      # ── HuggingFace model cache (2026-08-06) ────────────────────────────────
      # Stage 1 pulled `timm/regnety_160.swag_ft_in1k` from the Hub on EVERY run,
      # anonymously and with no cache, and started failing on it:
      #
      #   429 Client Error: Too Many Requests for
      #   https://huggingface.co/timm/regnety_160.swag_ft_in1k/resolve/main/config.json
      #   -> OSError: We couldn't connect to 'https://huggingface.co' ... and couldn't
      #      find them in the cached files.
      #
      # (run 31116677390). Anonymous Hub requests share a low rate limit, and this
      # workflow runs on push plus a 3-daily cron in a repo that also runs other
      # model-pulling jobs — so the limit is reachable through ordinary use, not
      # abuse. It surfaces as an OSError deep inside transformers, which reads like a
      # broken image rather than a throttle; that misdirection is half the cost.
      #
      # Two independent mitigations, because either alone can still fail:
      #   * the cache means a WARM run makes no Hub request at all;
      #   * HF_TOKEN (optional) raises the limit when the cache misses — a new model,
      #     or the 7-day eviction of an unused GitHub cache entry.
      #
      # The pc image declares HF_HOME=/cache/huggingface and runs as uid 10001, so the
      # host directory is mounted there and made writable before the container starts.
      - name: Cache HuggingFace models (Stage 1)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/hf-cache
          key: e2e-hf-${{ inputs.image-tag || 'latest' }}-regnety160
          restore-keys: e2e-hf-

      - name: Prepare the HF cache mount
        run: |
          mkdir -p "${{ github.workspace }}/hf-cache"
          chmod -R a+rwX "${{ github.workspace }}/hf-cache"

      - name: Stage 1 - Page Classification
        env:
          # Optional. Absent -> anonymous, which is what hit the 429; present -> a much
          # higher limit. Add an HF_TOKEN repository secret to harden this further.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >
          docker run --rm -v ${{ github.workspace }}:/workspace
          -v ${{ github.workspace }}/hf-cache:/cache/huggingface
          -e HF_TOKEN
          ghcr.io/ufal/atrium-page-classification:${{ inputs.image-tag || 'latest' }}
          -f /workspace/work/input/${E2E_DOC}-1.png
          -m timm/regnety_160.swag_ft_in1k --hf
          --document-json-out /workspace/work/doc_json/1_pc.json

      - name: Fetch latest ALTO Postprocess source
        uses: actions/checkout@v7
        with:
          repository: ufal/atrium-alto-postprocess
          path: work/atrium-alto-postprocess-main

      - name: Set permissions for ALTO Postprocess source
        run: chmod -R a+rwX ${{ github.workspace }}/work/atrium-alto-postprocess-main

      # (B9 / #50, #62) Runs the image AS BUILT: no entrypoint override, and nothing
      # fetched or installed at run time. This step used to wrap the stage in a
      # `/bin/sh -c` shim that pulled `alto-tools` from a moving
      # `refs/heads/master.zip` INSIDE the already-published image — overriding that
      # image's own commit pin at the moment of testing it, so whatever the lane
      # proved, it was not a property of the artefact we ship.
      # alto-postprocess vendored the two alto-tools code paths it used (its
      # `alto_tools.py`, Apache-2.0), so there is nothing left to fetch and no `PATH`
      # to re-export. `ENTRYPOINT ["python", "run_pipeline.py"]` (its Dockerfile,
      # stage `base` — the unsuffixed tag pulled here) now runs the stage, with the
      # arguments below appended to it, as in Stage 1.
      #
      # `-w` still points at the checked-out source, so `run_pipeline.py` and the
      # `alto_tools` module beside it both resolve from that checkout.
      - name: Stage 2 - ALTO Postprocess
        run: >
          docker run --rm -v ${{ github.workspace }}:/workspace
          -w /workspace/work/atrium-alto-postprocess-main
          ghcr.io/ufal/atrium-alto-postprocess:${{ inputs.image-tag || 'latest' }}
          --config /workspace/work/config_e2e_alto.txt
          --document-json /workspace/work/doc_json/1_pc.json
          --document-json-out /workspace/work/doc_json/2_alto.json

      - name: Fetch latest Translator source
        uses: actions/checkout@v7
        with:
          repository: ufal/atrium-translator
          path: work/atrium-translator-main

      - name: Set permissions for Translator source
        run: chmod -R a+rwX ${{ github.workspace }}/work/atrium-translator-main

      # (B9 / #62) Stages 3, 4 and 5 each used to replace the image's entrypoint with a
      # command BYTE-IDENTICAL IN EFFECT to the entrypoint it replaced. Three exact
      # no-ops: they cost nothing at runtime and everything in assurance, because the
      # lane then reported that it never exercised a real entrypoint -- while silently
      # doing so in all three cases. Deleting them changes no behaviour and makes the
      # lane honest about what it tests. Stage 1 has always had this shape.
      #
      #   stage 3  translator  ENTRYPOINT ["python", "main.py"]          (base)
      #   stage 4  nlp-enrich  ENTRYPOINT ["python", "run_pipeline.py"]  (base)
      #   stage 5  llm-enrich  ENTRYPOINT ["python"]                     (remote)
      #
      # SAFE AGAINST `:latest`, NOT JUST `test`. This lane defaults to the RELEASED
      # image set (see the header note), so the deletions are only sound if the
      # PUBLISHED images carry those entrypoints. Checked at each repo's newest release
      # tag before landing: translator v0.10.5, nlp-enrich v0.20.1, llm-enrich v0.6.3 --
      # all three declare exactly the lines above.
      #
      # THE TRAP, and the one way to get this wrong: with the interpreter forced as the
      # entrypoint, `main.py` was argv[1] TO PYTHON. Without it, ENTRYPOINT already
      # supplies the script, so leaving `main.py` here would pass it as an argument TO
      # main.py. Stages 3 and 4 therefore drop the script name along with the override;
      # stage 5 KEEPS `openrouter_client.py`, because llm-enrich's `remote` stage
      # entrypoint is the bare interpreter and the script really is its first argument.
      # None of this is visible to YAML linting -- only to a run.
      #
      # `-w` still points at the checked-out source, so the relative script names in
      # those entrypoints resolve from that checkout exactly as they did before. That
      # `-w` is a SEPARATE build/release/run gap (the lane runs the image's interpreter
      # against the repository's source, so a change that never reached the image still
      # passes) and has its own follow-up; it is not this issue's to close.
      #
      # tests/test_e2e_entrypoints.py is what stops a silent override returning.
      - name: Stage 3 - Translator
        run: >
          docker run --rm -v ${{ github.workspace }}:/workspace
          -w /workspace/work/atrium-translator-main
          ghcr.io/ufal/atrium-translator:${{ inputs.image-tag || 'latest' }}
          /workspace/work/PAGE_ALTO/${E2E_DOC}/${E2E_DOC}-1.alto.xml
          --alto --formats alto.xml --source_lang cs --target_lang en
          -o /workspace/work/translated
          --document-json /workspace/work/doc_json/2_alto.json
          --document-json-out /workspace/work/doc_json/3_translate.json

      - name: Fetch latest NLP Enrich source
        uses: actions/checkout@v7
        with:
          repository: ufal/atrium-nlp-enrich
          path: work/atrium-nlp-enrich-main

      - name: Set permissions for NLP Enrich source
        run: chmod -R a+rwX ${{ github.workspace }}/work/atrium-nlp-enrich-main

      # Runs the image as built -- see the note above Stage 3. `run_pipeline.py` is gone
      # from the command because ENTRYPOINT ["python", "run_pipeline.py"] supplies it.
      - name: Stage 4 - NLP Enrich
        run: >
          docker run --rm -v ${{ github.workspace }}:/workspace
          -w /workspace/work/atrium-nlp-enrich-main
          ghcr.io/ufal/atrium-nlp-enrich:${{ inputs.image-tag || 'latest' }}
          --config /workspace/work/config_e2e_nlp.txt
          --stages manifest udp nt stats
          --document-json /workspace/work/doc_json/3_translate.json
          --document-json-out /workspace/work/doc_json/4_nlp.json

      - name: Fetch latest LLM Enrich source
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: ufal/atrium-llm-enrich
          path: work/atrium-llm-enrich-main

      - name: Set permissions for LLM Enrich source
        if: steps.gate.outputs.enabled == 'true'
        run: chmod -R a+rwX ${{ github.workspace }}/work/atrium-llm-enrich-main

      - name: Stage 5 - LLM Enrich
        id: llm
        if: steps.gate.outputs.enabled == 'true'
        # Runs the image as built -- see the note above Stage 3. `openrouter_client.py`
        # STAYS: the `remote` stage's entrypoint is the bare interpreter, so the script
        # name is a real argument to it, not a duplicate of it.
        #
        # The gate above proves the SECRET EXISTS. It cannot prove OpenRouter will accept
        # it, and those are different failures. A revoked key, an exhausted balance or a
        # provider-routing refusal comes back as an HTTP 4xx from the provider — and used
        # to fail this job outright, reporting somebody else's billing problem as though
        # the ATRIUM pipeline had regressed. Run 132 (2026-09-11) is the worked example:
        # "403 Client Error: Forbidden", stages 1-4 green, nothing in this repo broken.
        #
        # So an UPSTREAM REFUSAL is demoted to the path a missing secret already takes:
        # Stage 5 is marked not-run and the contract assertion below drops the 5_llm
        # stage from its expected list. Every OTHER failure still fails hard, because
        # that is the pipeline's own bug and this workflow exists to catch it.
        #
        # The SCHEDULED run is deliberately exempt and still fails: the nightly is what
        # notices a dead key, and a warning nobody reads is how a key stays dead for a
        # month. Same split as "Require the secret on scheduled runs" above.
        run: |
          set +e
          docker run --rm -e OPENROUTER_API_KEY -e OPENROUTER_MODEL \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/work/atrium-llm-enrich-main \
            ghcr.io/ufal/atrium-llm-enrich-remote:${{ inputs.image-tag || 'latest' }} \
            openrouter_client.py \
            --input "/workspace/work/DOC_LINE_CATEG/${E2E_DOC}.csv" \
            --output-dir /workspace/work/llm_out \
            --config /workspace/work/llm_config.txt \
            --model "${{ env.OPENROUTER_MODEL }}" \
            --provider-data-collection deny \
            --document-json /workspace/work/doc_json/4_nlp.json \
            --document-json-out /workspace/work/doc_json/5_llm.json 2>&1 | tee "$RUNNER_TEMP/stage5.log"
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An upstream refusal: the provider answered, and the answer was "no". Matched
          # on openrouter_client.py's own retry-exhausted line so a 4xx buried in ordinary
          # output cannot trip this — it has to be the failure that ended the call.
          if grep -qE 'request failed after [0-9]+ attempts: (401|402|403|429) ' "$RUNNER_TEMP/stage5.log"; then
            CODE=$(grep -oE 'attempts: (401|402|403|429) ' "$RUNNER_TEMP/stage5.log" | grep -oE '[0-9]{3}' | head -1)
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::Stage 5 unusable: OpenRouter refused the request (HTTP $CODE)."
              echo "::error::OPENROUTER_KEY is set but rejected — check the key is live and the account funded."
              exit 1
            fi
            echo "::warning::Stage 5 skipped: OpenRouter refused the request (HTTP $CODE)."
            echo "::warning::This is an upstream credential/quota problem, not a pipeline defect."
            echo "::warning::OPENROUTER_KEY is set but rejected — check the key is live and the account funded."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Stage 5 failed inside the pipeline (exit $rc), not an upstream refusal."
          exit "$rc"

      # The stage records are passed in explicitly, not globbed, so this step
      # states which stages were expected to write one: a stage whose document
      # hook failed silently (nlp's degrades to a stderr warning and exit 0) then
      # fails HERE by name instead of vanishing from a glob (#10, D1/D2/J4).
      - name: Assert Final Document Contract
        env:
          # Threading Stage 5's OWN outcome is the G5 fix: e2e_assert.py used to assert
          # the 'enrichment' block unconditionally, on the exact path this workflow makes
          # optional. This reads the step, not the gate, because the secret being present
          # no longer implies the stage ran — OpenRouter can refuse a key that exists.
          LLM_STAGE_RAN: ${{ steps.llm.outputs.ran == 'true' }}
        run: |
          FINAL="work/doc_json/5_llm.json"
          [ -f "$FINAL" ] || FINAL="work/doc_json/4_nlp.json"
          STAGES="work/doc_json/1_pc.json work/doc_json/2_alto.json"
          STAGES="$STAGES work/doc_json/3_translate.json work/doc_json/4_nlp.json"
          if [ "$LLM_STAGE_RAN" = "true" ]; then
            STAGES="$STAGES work/doc_json/5_llm.json"
          fi
          echo "Asserting against: $FINAL"
          # shellcheck disable=SC2086 — STAGES is a deliberate list of paths
          python tools/e2e/e2e_assert.py "$FINAL" \
            --llm-stage-ran "$LLM_STAGE_RAN" \
            --stages $STAGES

      - name: Upload Pipeline Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-pipeline-outputs
          path: work/doc_json/*.json

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `E2E pipeline smoke failed (${new Date().toISOString().slice(0,10)})`;
            const body = `The cross-repo e2e pipeline smoke test failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nLikely a cross-repo interface change on \`main\`, a LINDAT/HuggingFace/OpenRouter upstream change, a stale \`:latest\` tag, or a stale e2e fixture.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["ci", "pipeline"],
            });
