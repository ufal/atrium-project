# Reusable: atrium-project — end-to-end pipeline integration smoke test
# The scanned-document route of record schema 2.0 (atrium-project#84) on the published images at
# `image-tag`: the ATR's docproc (a stand-in, fixtures/e2e/docproc/) -> ocr-postprocess builds and
# scores the record -> page-classification adds the page categories -> nlp-enrich -> keyword-extract,
# with the record contract asserted after the stages and the RO-Crate validated. The translator is
# not in the chain: `metadata-en` is a record-level job on archiving, and full-text translation is
# parked. Runs on hub pushes to main, by dispatch and as a reusable workflow (no schedule since
# 2026-11-14). Reasons and history: docs/decisions/e2e-lanes.md.
name: Reusable E2E Pipeline Smoke Test

on:
  workflow_call:
    inputs:
      openrouter-model:
        description: >-
          OpenRouter model id for keyword-extract's controlled (LLM) kind (atrium-keyword-extract#1).
          The step makes one call per line of the record, so it runs only on records of at most 25
          lines (the default fixture makes one or two).
        default: "openai/gpt-4o-mini"
        type: string
        required: false
      image-tag:
        description: >-
          GHCR tag every stage runs. `latest` is the RELEASED image set;
          `test` tracks each repo's test branch. See the note below.
        default: "latest"
        type: string
        required: false
      e2e-doc:
        description: >-
          Fixture under fixtures/e2e/ (docproc/<id>.atr.docproc.json, the ATR's stand-in, and
          ALTO/<id>.alto.xml, its source and the page image's) the chain runs on. The default is
          the single-page synthetic CTX000000003. The other four are multi-page, and
          page-classification sees page 1 only; every other stage sees the whole document.
        default: "CTX000000003"
        type: string
        required: false
      seed:
        description: >-
          Start the chain from an AMČR-style seed (atrium-project#71): Stage 1 gets a record
          with only doc_id (unlike every file name) and source.sha512/filename/media_type, and
          every stage must keep them. The pilot's integration baseline, so on by default.
        default: true
        type: boolean
        required: false
    secrets:
      HF_TOKEN:
        description: "Optional Hugging Face token for Stage 1's model download (raises the anonymous rate limit)"
        required: false
      OPENROUTER_KEY:
        description: >-
          OpenRouter API key for keyword-extract's controlled kind. Without it that step is skipped
          with a warning.
        required: false
  workflow_dispatch:
    inputs:
      image-tag:
        description: "GHCR tag to run (latest = released, test = current test branches)"
        default: "latest"
        type: string
        required: false
      e2e-doc:
        description: "Fixture to run (fixtures/e2e/; multi-page ones reach page-classification as page 1 only)"
        default: "CTX000000003"
        type: choice
        options:
          - CTX000000003
          - CTX000000001
          - CTX000000002
          - CTX192100040
          - CTX192601143
      seed:
        description: "Start from an AMČR-style seed (atrium-project#71); off reproduces the unseeded chain"
        default: true
        type: boolean
        required: false
  push:
    branches: [ main ]

# What a run tests (issue #10): the stages are PUBLISHED images, and `:latest` moves only on a
# version tag, so `image-tag: latest` validates THE LAST RELEASE of each tool. `image-tag: test`
# (published on every push to a repo's `test` branch) validates what is about to be released, and
# is what a push runs (channel by event, as the born-digital lane does). A dispatch or a caller
# chooses. History: docs/decisions/e2e-lanes.md#what-a-pipeline-run-tests

concurrency:
  group: e2e-pipeline-smoke-${{ github.ref }}
  cancel-in-progress: false

# Push runs have no inputs, so they keep CTX000000003 (roadmap S6, #69).
env:
  E2E_DOC: ${{ inputs.e2e-doc || 'CTX000000003' }}
  # Push runs have no inputs and run seeded. Compared as a string on purpose: in an
  # expression a missing input (null) loosely EQUALS false, which would turn the default off.
  E2E_SEED: ${{ format('{0}', inputs.seed) == 'false' && 'false' || 'true' }}
  # A push runs `:test`; a dispatch or a caller the tag it names (`latest` by default).
  IMAGE_TAG: ${{ inputs.image-tag || (github.event_name == 'push' && 'test' || 'latest') }}

jobs:
  e2e-json-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      packages: read
      contents: read

    steps:
      # The default checkout, on purpose: this workflow lives in the hub, so fixtures/e2e/ and
      # tools/e2e/ come from the commit under test. Never pin it to another ref such as `v1`: the
      # lane would then assert with fixtures and tooling that do not ship with it.
      # History: docs/decisions/e2e-lanes.md#hub-checkout
      - name: Checkout ATRIUM Hub Repository
        uses: actions/checkout@v7

      # Before anything is pulled: a name with no fixture pair (a typo in a workflow_call
      # caller, which has no choice list) would otherwise surface as a `cp` error after
      # the setup steps. E2E_DOC also becomes part of paths, so only a bare id passes.
      - name: Check the requested fixture exists
        run: |
          if ! printf '%s' "$E2E_DOC" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            # Not echoed: it failed the check, so it may carry a newline and a `::` command.
            echo "::error::e2e-doc is not a fixture id (letters, digits, '-', '_' only)"
            exit 1
          fi
          for f in "fixtures/e2e/ALTO/${E2E_DOC}.alto.xml" "fixtures/e2e/docproc/${E2E_DOC}.atr.docproc.json"; do
            if [ ! -f "$f" ]; then
              echo "::error::no fixture pair for e2e-doc '$E2E_DOC': $f is missing"
              echo "Available: $(for a in fixtures/e2e/ALTO/*.alto.xml; do basename "$a" .alto.xml; done | tr '\n' ' ')"
              exit 1
            fi
          done
          echo "Running the chain on ${E2E_DOC}"

      - name: Set up Python for Assertions
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/e2e/requirements.txt

      - name: Install e2e tooling dependencies
        run: pip install -r tools/e2e/requirements.txt

      - name: Create workspace
        run: |
          W="${{ github.workspace }}/work"
          mkdir -p "$W/input" "$W/docproc" "$W/doc_json" "$W/records" "$W/paradata/ocr" \
                   "$W/DOC_TEXT" "$W/nlp_out" "$W/TEMP"
          cp "fixtures/e2e/docproc/${E2E_DOC}.atr.docproc.json" "$W/docproc/"
          chmod -R a+rwX "$W"

      # atrium-project#71: what AMČR hands the first stage. doc_id is an AMČR-style file id that
      # matches no file name in the chain, and sha512 is the fixture's own digest, standing in for
      # Fedora's. The origin is left out on purpose: the stage that reads the source writes it.
      - name: Write the AMČR seed
        if: env.E2E_SEED == 'true'
        run: >
          python tools/e2e/make_seed.py "fixtures/e2e/ALTO/${E2E_DOC}.alto.xml"
          --doc-id "AMCR-F-${E2E_DOC}" --media-type application/alto+xml
          --out work/doc_json/0_seed.json

      - name: Render fixture page image from the ALTO
        run: |
          python3 tools/e2e/render_alto_page.py \
            "fixtures/e2e/ALTO/${E2E_DOC}.alto.xml" \
            --out "${{ github.workspace }}/work/input/${E2E_DOC}-1.png"

      # SAVE_TEITOK=true: the record's pages[].teitok_surface and entities[].teitok_ref are ids in
      # that file; the assert step checks that the file and the record agree (--teitok-dir).
      # INPUT_TABLES_DIR starts empty: `--text-from-record` writes the record's lines there.
      - name: Write nlp-enrich e2e config
        run: |
          W="${{ github.workspace }}/work"
          cat > "$W/config_e2e_nlp.txt" <<EOF
          OUTPUT_DIR="/workspace/work/nlp_out"
          INPUT_TABLES_DIR="/workspace/work/DOC_TEXT"
          WORK_DIR="/workspace/work/TEMP"
          LOG_FILE="/workspace/work/nlp_out/processing.log"
          CONLLU_INPUT_DIR="/workspace/work/nlp_out/UDP"
          TEMP_TXT_DIR="/workspace/work/TEMP/TXT_EXTRACT"
          CHUNK_DIR="/workspace/work/TEMP/CHUNKS"
          TSV_INPUT_DIR="/workspace/work/nlp_out/NE"
          SUMMARY_OUTPUT_DIR="/workspace/work/nlp_out/UDP_NE"
          TEITOK_OUTPUT_DIR="/workspace/work/nlp_out/TEITOK"
          PARADATA_DIR="/workspace/work/nlp_out/paradata"
          UDPIPE_URL="${UDPIPE_URL:-https://lindat.mff.cuni.cz/services/udpipe/api/process}"
          NAMETAG_URL="${NAMETAG_URL:-https://lindat.mff.cuni.cz/services/nametag/api/recognize}"
          MODEL_UDPIPE="czech-pdt-ud-2.15-241121"
          MODEL_NAMETAG="nametag3-multilingual-onto-260521"
          TIMEOUT=60
          MAX_RETRIES=5
          BACKOFF_FACTOR=1.5
          WORD_CHUNK_LIMIT=900
          SAVE_CSV=true
          SAVE_CONLLU_NE=true
          SAVE_TEITOK=true
          FAIL_ON_EMPTY=true
          EOF

      # ── Hugging Face model cache (page-classification, ocr-postprocess) ─────────
      # page-classification downloads `timm/regnety_160.swag_ft_in1k` from the Hub, and ocr-postprocess
      # its perplexity model for scoring. Anonymous Hub requests share a low rate limit, and a 429
      # surfaces deep in transformers as an OSError that reads like a broken image. Two mitigations,
      # as either alone can fail: the cache (a warm run makes no Hub request) and the optional
      # HF_TOKEN (a higher limit on a miss). Both images read HF_HOME=/cache/huggingface as a non-root
      # user: the host directory is mounted there, writable.
      # History: docs/decisions/e2e-lanes.md#hugging-face-model-cache
      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/hf-cache
          key: e2e-hf-${{ env.IMAGE_TAG }}-regnety160-ocr
          restore-keys: e2e-hf-

      - name: Prepare the HF cache mount
        run: |
          mkdir -p "${{ github.workspace }}/hf-cache"
          chmod -R a+rwX "${{ github.workspace }}/hf-cache"

      # Stage 1: the record from the ATR's docproc (here its stand-in), built and scored by
      # ocr-postprocess (D18 rules 1–7). The batch image runs `build_record.py` through its
      # entrypoint's interpreter rule (container_entrypoint.py: `python3 SCRIPT` runs as given), so
      # the image's own ENTRYPOINT still starts it: no entrypoint override (B9, #62).
      - name: Stage 1 - OCR Postprocess builds the record
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ID_ARGS=(--doc-id "${E2E_DOC}")
          if [ "$E2E_SEED" = "true" ]; then
            ID_ARGS=(--seed /workspace/work/doc_json/0_seed.json)
          fi
          docker run --rm -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/hf-cache:/cache/huggingface" -e HF_TOKEN \
            "ghcr.io/ufal/atrium-ocr-postprocess:${IMAGE_TAG}" \
            python3 /app/build_record.py "/workspace/work/docproc/${E2E_DOC}.atr.docproc.json" \
            "${ID_ARGS[@]}" \
            --out-dir /workspace/work/records --paradata-dir /workspace/work/paradata/ocr
          cp work/records/*.document.json work/doc_json/1_record.json

      # Stage 2: page-classification on the page image, its categories into the record (H3).
      - name: Stage 2 - Page Classification
        env:
          # Optional: absent means anonymous Hub requests; an HF_TOKEN secret raises the limit.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/hf-cache:/cache/huggingface" \
            -e HF_TOKEN \
            "ghcr.io/ufal/atrium-page-classification:${IMAGE_TAG}" \
            -f "/workspace/work/input/${E2E_DOC}-1.png" \
            -m timm/regnety_160.swag_ft_in1k --hf \
            --document-json /workspace/work/doc_json/1_record.json \
            --document-json-out /workspace/work/doc_json/2_pc.json

      # Stage 3 runs its image as built too (B9, #62): ENTRYPOINT ["python", "run_pipeline.py"]
      # supplies the script, so the command is only its arguments; the record is the text
      # (`--text-from-record`: its lines, in record order, with their pages and blocks).
      # tests/test_e2e_entrypoints.py stops an entrypoint override from returning silently.
      # History: docs/decisions/e2e-lanes.md#stages-3-and-4-entrypoints
      - name: Stage 3 - NLP Enrich
        run: >
          docker run --rm -v ${{ github.workspace }}:/workspace
          ghcr.io/ufal/atrium-nlp-enrich:${IMAGE_TAG}
          --config /workspace/work/config_e2e_nlp.txt
          --stages manifest udp nt stats
          --text-from-record
          --document-json /workspace/work/doc_json/2_pc.json
          --document-json-out /workspace/work/doc_json/3_nlp.json

      # The stage records are passed in explicitly, not globbed, so this step
      # states which stages were expected to write one: a stage whose document
      # hook failed silently (nlp's degrades to a stderr warning and exit 0) then
      # fails HERE by name instead of vanishing from a glob (#10, D1/D2/J4).
      - name: Assert Final Document Contract
        run: |
          FINAL="work/doc_json/3_nlp.json"
          STAGES="work/doc_json/1_record.json work/doc_json/2_pc.json work/doc_json/3_nlp.json"
          SEED_ARGS=()
          if [ "$E2E_SEED" = "true" ]; then
            SEED_ARGS=(--seed work/doc_json/0_seed.json)
          fi
          echo "Asserting against: $FINAL"
          # --llm-stage-ran false: this record is nlp-enrich's, which is before keyword-extract's
          # controlled (LLM) kind, so `enrichment` is not required here. The record after that
          # kind is asserted below, in "Assert the record after keyword-extract".
          # STAGES is a deliberate list of paths.
          # shellcheck disable=SC2086
          python tools/e2e/e2e_assert.py "$FINAL" \
            --llm-stage-ran false \
            --stages $STAGES \
            --teitok-dir work/nlp_out/TEITOK \
            --require-current-major \
            "${SEED_ARGS[@]}"

      # ── Keyword Extract (atrium-keyword-extract#1) ───────────────────────────────────────
      # The statistical kind, through the production `-api` image run as built, on the record
      # Stage 3 wrote: it must answer with keywords carrying a method and a score, and return the
      # record with its `keywords` block (atrium-project#73), saved as 4_kw_stat.json; an image
      # older than v1.2.0-beta (by its /info version) only warns. YAKE, not KeyBERT, so no model is
      # downloaded from the Hub: a test choice, not the service default. A missing image is a warning.
      - name: Keyword Extract (statistical kind)
        id: kw_statistical
        env:
          # The warm-up downloads the KeyBERT model from the Hub, as Stage 1 does its model: the
          # optional token raises the anonymous rate limit there too.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          IMAGE="ghcr.io/ufal/atrium-keyword-extract-api:${IMAGE_TAG}"
          if ! docker pull "$IMAGE"; then
            echo "::warning::$IMAGE is not published yet (keyword-extract's first release or first test push); the keyword step is skipped."
            echo "**Skipped:** $IMAGE is not published yet (keyword-extract's first release or first test push); the keyword step is skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CID=$(docker run -d -e PORT=8080 -e HF_TOKEN -p 8080:8080 "$IMAGE")
          trap 'docker logs "$CID" | tail -40; docker rm -f "$CID" >/dev/null 2>&1' EXIT
          # /ready is 503 until the startup warm-up has loaded the KeyBERT model (a first-run download).
          for _ in $(seq 1 150); do
            if curl -fsS http://localhost:8080/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ready
          curl -fsS http://localhost:8080/info -o work/keywords_stat_info.json
          curl -fsS -X POST http://localhost:8080/extract_keywords \
            -F "document_json=@work/doc_json/3_nlp.json;type=application/json" \
            -F kind=statistical -F method=yake -F num_keywords=5 -o work/keywords.json
          PYTHONPATH=docs/templates/shared python - <<'PY'
          import json
          import os

          from atrium_openapi import version_key

          r = json.load(open("work/keywords.json", encoding="utf-8"))
          kws = r.get("keywords") or []
          assert kws, f"no keywords in the response: {sorted(r)}"
          for k in kws:
              assert k.get("method") == "yake" and isinstance(k.get("score"), (int, float)), k
          assert r.get("paradata"), "no CreateAction (paradata) in the response (atrium-project#71)"
          print(f"keywords: {len(kws)} from {kws[0]['method']}, first: {kws[0]['keyword']!r}")
          version = json.load(open("work/keywords_stat_info.json", encoding="utf-8")).get("version") or "0.0.0"
          record = r.get("document_json")
          if record is None:
              assert version_key(version) < version_key("1.2.0-beta"), (
                  f"keyword-extract {version} answered without the record: its `keywords` block is missing (atrium-project#73)"
              )
              print(f"::warning::keyword-extract {version} predates the record's `keywords` block (v1.2.0-beta); not checked in this run.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"**Skipped:** keyword-extract {version} predates the record's `keywords` block (v1.2.0-beta); not checked in this run.\n")
          else:
              assert "document_json_schema_error" not in r, r["document_json_schema_error"]
              assert record["keywords"]["document"] == kws, "the record's document keywords are not the response's"
              assert record["keywords"]["pages"] == r.get("pages"), "the record's page keywords are not the response's"
              json.dump(record, open("work/doc_json/4_kw_stat.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("record=true\n")
              print(f"record: keywords block with {len(record['keywords']['pages'])} page list(s) -> 4_kw_stat.json")
          PY

      # The record after the statistical kind: the final-contract assertions, with `keywords` required.
      - name: Assert the record after keyword-extract (statistical kind)
        if: steps.kw_statistical.outputs.record == 'true'
        run: |
          SEED_ARGS=()
          if [ "$E2E_SEED" = "true" ]; then
            SEED_ARGS=(--seed work/doc_json/0_seed.json)
          fi
          STAGES="work/doc_json/1_record.json work/doc_json/2_pc.json work/doc_json/3_nlp.json"
          STAGES="$STAGES work/doc_json/4_kw_stat.json"
          # STAGES is a deliberate list of paths.
          # shellcheck disable=SC2086
          python tools/e2e/e2e_assert.py work/doc_json/4_kw_stat.json \
            --llm-stage-ran false \
            --keywords-stage-ran true \
            --stages $STAGES \
            --teitok-dir work/nlp_out/TEITOK \
            --require-current-major \
            "${SEED_ARGS[@]}"

      # ── Keyword Extract, the controlled kind (atrium-keyword-extract#1, #2) ─────────────────
      # The same image with an LLM backend: the record after the statistical kind (`4_kw_stat.json`,
      # or Stage 3's when the image predates it) goes in; the record with keyword-extract's
      # `enrichment` block (and `entities[].pid`) comes out as `5_kw.json`. The lane's one call to a
      # paid third-party model, so:
      #   * without the OPENROUTER_KEY secret it is skipped with a warning;
      #   * it runs only on records of at most E2E_CONTROLLED_MAX_LINES lines (one call per line);
      #   * the model's answer is reported, not asserted, so provider drift cannot flap the gate.
      #     Asserted: the backend started, the call succeeded, and the response's CreateAction meets
      #     the shared contract and names `enrichment` among the record fields it wrote (#71, #84).
      # keyword-extract's controlled-live.yml covers a fixed record; this covers the chain's record.
      - name: Keyword Extract (controlled kind, OpenRouter)
        id: kw_controlled
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_MODEL: ${{ inputs.openrouter-model || 'openai/gpt-4o-mini' }}
          E2E_CONTROLLED_MAX_LINES: "25"
        run: |
          echo "ran=false" >> "$GITHUB_OUTPUT"
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::no OPENROUTER_KEY secret; keyword-extract's controlled kind is not checked in this run."
            echo "**Skipped:** no OPENROUTER_KEY secret; keyword-extract's controlled kind is not checked in this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The record the statistical kind returned, when there is one: both kinds accrete onto it.
          KW_IN=work/doc_json/3_nlp.json
          if [ -f work/doc_json/4_kw_stat.json ]; then KW_IN=work/doc_json/4_kw_stat.json; fi
          # What the service will send: the record's lines, or, for a record that holds its text in
          # `content.text` alone, every non-empty line of that (tools/e2e/controlled_rows.py).
          LINES=$(python tools/e2e/controlled_rows.py "$KW_IN")
          if [ "$LINES" -gt "$E2E_CONTROLLED_MAX_LINES" ]; then
            echo "::notice::${E2E_DOC} has $LINES lines and the controlled kind makes one paid call per line (limit $E2E_CONTROLLED_MAX_LINES): skipped. The small fixtures run it."
            exit 0
          fi
          IMAGE="ghcr.io/ufal/atrium-keyword-extract-api:${IMAGE_TAG}"
          if ! docker pull "$IMAGE"; then
            echo "::warning::$IMAGE is not published; the controlled kind is not checked."
            echo "**Skipped:** $IMAGE is not published; the controlled kind is not checked." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # KeyBERT is not the question here, so the statistical default is the one with nothing to load.
          CID=$(docker run -d -e PORT=8080 -p 8080:8080 \
            -e LLM_BACKEND=openrouter -e OPENROUTER_API_KEY -e OPENROUTER_MODEL \
            -e DEFAULT_KW_METHOD=yake "$IMAGE")
          trap 'docker logs "$CID" | tail -40; docker rm -f "$CID" >/dev/null 2>&1' EXIT
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ready
          curl -fsS http://localhost:8080/info -o work/keywords_info.json
          PYTHONPATH=docs/templates/shared python - <<'PY'
          import json

          info = json.load(open("work/keywords_info.json", encoding="utf-8")).get("controlled") or {}
          assert info.get("ready") is True, f"the controlled kind did not start: {info}"
          print(f"controlled kind ready: {info['backend']} / {info['model']}, {info['vocabulary']['prompt_terms']} vocabulary terms in the prompt")
          PY
          curl -fsS --max-time 900 -X POST http://localhost:8080/extract_keywords \
            -F "document_json=@${KW_IN};type=application/json" \
            -F kind=controlled -o work/keywords_controlled.json
          PYTHONPATH=docs/templates/shared python - <<'PY'
          import json

          from atrium_rocrate import action_problems

          body = json.load(open("work/keywords_controlled.json", encoding="utf-8"))
          controlled = body.get("controlled") or {}
          assert controlled.get("outcome") == "contributed", f"the model contributed nothing: {controlled}"
          items = (body.get("enrichment") or {}).get("items") or []
          assert items, f"no enrichment items in the response: {sorted(body)}"
          assert "document_json_schema_error" not in body, body["document_json_schema_error"]
          record = body["document_json"]
          action = body.get("paradata")
          problems = action_problems(action)
          assert not problems, f"the response's CreateAction: {problems}"
          written = [e.get("recordFields") for e in action.get("result") or [] if e.get("name") == "atrium/document-json"]
          assert written and "enrichment" in written[0], f"the CreateAction does not name `enrichment` as written: {written}"
          json.dump(record, open("work/doc_json/5_kw.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          for item in items:
              print(f"P{item['page']} L{item['line']}: {item['teater_category']!r} cs={item.get('extracted_keywords_cs')}")
          print(f"✅ {len(items)} line(s) by {controlled['model']}; paradata {action['@id']} wrote `enrichment`")
          PY
          echo "ran=true" >> "$GITHUB_OUTPUT"

      # The contract on the record after keyword-extract: the same assertions as the final-contract
      # step, with `enrichment` now required (the stage ran), over the five stage records.
      - name: Assert the record after keyword-extract
        if: steps.kw_controlled.outputs.ran == 'true'
        run: |
          SEED_ARGS=()
          if [ "$E2E_SEED" = "true" ]; then
            SEED_ARGS=(--seed work/doc_json/0_seed.json)
          fi
          STAGES="work/doc_json/1_record.json work/doc_json/2_pc.json work/doc_json/3_nlp.json"
          if [ -f work/doc_json/4_kw_stat.json ]; then STAGES="$STAGES work/doc_json/4_kw_stat.json"; fi
          STAGES="$STAGES work/doc_json/5_kw.json"
          # --keywords-stage-ran auto: `keywords` is required when the statistical kind wrote it upstream.
          # STAGES is a deliberate list of paths.
          # shellcheck disable=SC2086
          python tools/e2e/e2e_assert.py work/doc_json/5_kw.json \
            --llm-stage-ran true \
            --keywords-stage-ran auto \
            --stages $STAGES \
            --teitok-dir work/nlp_out/TEITOK \
            --require-current-major \
            "${SEED_ARGS[@]}"

      - name: Install the RO-Crate validator
        run: pip install -r tools/ci/requirements-rocrate.txt

      # atrium-project#71, the "production crate output" of its acceptance criteria: the final
      # record and every stage's paradata file become the fragment AMČR embeds in its record
      # crate. It is checked under a stub root, against RO-Crate 1.2 and Process Run Crate 0.5,
      # each in its own validator run, gated at MUST: a real run may lack a SHOULD (no
      # ATRIUM_RUN_AGENT, say), which is reported as a warning.
      - name: Validate the record crate (RO-Crate 1.2, Process Run Crate 0.5)
        run: |
          FINAL="work/doc_json/3_nlp.json"
          mapfile -t PARADATA < <(find work -path '*/paradata/*' -name '[!.]*.json' -type f | sort)
          echo "Paradata files: ${#PARADATA[@]}"
          python tools/ci/rocrate_check.py --record "$FINAL" --paradata "${PARADATA[@]}" --out work/crate

      # atrium-project#81 (policy rule 8) and #77: which build of each image ran, by digest. The
      # manifest of a green run at a version tag is the set proposed to AMČR for the pilot.
      - name: Record the images of this run
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 tools/e2e/e2e_manifest.py --lane pipeline --tag "$IMAGE_TAG" --status "$JOB_STATUS" \
            --image "ghcr.io/ufal/atrium-page-classification:$IMAGE_TAG" \
            --image "ghcr.io/ufal/atrium-ocr-postprocess:$IMAGE_TAG" \
            --image "ghcr.io/ufal/atrium-nlp-enrich:$IMAGE_TAG" \
            --image "ghcr.io/ufal/atrium-keyword-extract-api:$IMAGE_TAG" \
            --info "ghcr.io/ufal/atrium-keyword-extract-api:$IMAGE_TAG=work/keywords_stat_info.json" \
            --out work/e2e-manifest.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the image manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-manifest-pipeline
          path: work/e2e-manifest.json
          if-no-files-found: warn

      - name: Upload Pipeline Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-pipeline-outputs
          path: |
            work/doc_json/*.json
            work/keywords.json
            work/keywords_stat_info.json
            work/keywords_controlled.json
            work/keywords_info.json
            work/nlp_out/TEITOK/*.teitok.xml
            work/crate/
            work/records/
            work/paradata/
