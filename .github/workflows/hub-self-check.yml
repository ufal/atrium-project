# ATRIUM hub — the hub checking itself (issue #18, T7).
#
# WHY THIS EXISTS. This repository is the source of truth for 45 caller jobs
# (42 in the six tool repos at `@v1`, 3 hub-local by path; counted 2026-10-20), and
# for the canonical modules para-drift.reusable.yml forces byte-identical into all
# six tool repos. Until 2026-07-31 it had no caller
# workflows at all — only `workflow_call` reusables plus the E2E and issue-log
# jobs — so nothing in CI parsed, linted or policy-checked any of it.
#
# The cost was not theoretical: two files were silently overwritten with copies
# of other files, a SHA-pinning pass missed one of eleven occurrences, and
# test_para_licenses.py sat here with 36 passing tests that no workflow invoked.
#
# Every job reads only, needs no secrets, and finishes in well under a minute.

name: Hub Self-Check

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  # Weekly, because the pin check resolves real tags: an action's tag can be
  # force-pushed while nothing in this repo changes. Staggered clear of CodeQL
  # (5:15) and pre-commit (5:30).
  schedule:
    - cron: "45 5 * * 1"
  # A manual re-run path (roadmap E11, atrium-project#69): a scheduled run that failed
  # on something outside this repo (a missing secret, a force-pushed action tag) can be
  # re-run once that is fixed, without an empty commit. The concurrency group below
  # already keys on `github.event_name`, so a dispatch never cancels a push run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # `github.event_name` keeps a push from cancelling the scheduled run: this group was
  # keyed by ref alone, so both landed in ONE group and the push won -- and a cancelled
  # nightly reports no failure rather than a result. (issue atrium-project#10)
  cancel-in-progress: true

jobs:
  # Calls the reusable by LOCAL path rather than @v1 so the self-check validates
  # the ref being pushed. A repo whose self-check is pinned to its own released
  # tag can never catch a broken reusable before that tag moves.
  workflow-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.reusable.yml
    with:
      # Issue #10, G6: the local path above only picks the ref for the reusable's
      # LOGIC. The reusable then clones the hub a second time at `hub-ref` and runs
      # `python hub-repo/tools/ci/workflow_lint.py` from THAT clone — so with the
      # default (`v1`) a PR editing the linter was checked by whatever `v1` already
      # pointed at, never by its own edited code. github.sha is the ref under test,
      # which is the only value that closes the loop.
      hub-ref: ${{ github.sha }}

  shared-tests:
    name: Test canonical shared modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The PR's labels, read by the step that picks the tools' branch.
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # History and tags: tests/test_schema_freeze_records.py checks each frozen schema
          # against its release tag, and skipped in the default shallow, tagless checkout.
          fetch-depth: 0

      # The tool repositories beside the hub, where every ÚFAL working copy has them: 21 tests
      # check them (their hub-reusable callers and pins, image declarations, .env.example tables,
      # the oasdiff version their release workflows install) and skipped without them. Their
      # `test` heads: a hub change the tools have not followed yet fails here, which is the sign
      # not to move `v1` yet.
      #
      # A hub PR that the tool PRs follow (a schema change landing in all seven) cannot pass
      # against the `test` heads before those PRs merge, and they cannot merge before it: their
      # drift check reads the hub at `v1` (atrium-project#87). Label such hub PRs
      # `siblings:<branch>`: the tools are cloned at that branch where they have it, at `test`
      # where not. The label is read when the job runs, so re-run the job after adding it, and
      # remove it once the tool PRs have merged. Pushes, the weekly run and dispatch clone `test`.
      - name: Choose the tool repositories' branch (a PR's siblings label)
        id: siblings
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # From the API, not the event payload: a re-run reuses the payload of the run it
          # repeats, which predates a label added since.
          labels=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.labels[].name')
          picked=()
          while IFS= read -r label; do
            case "${label}" in siblings:*) picked+=("${label#siblings:}") ;; esac
          done <<< "${labels}"
          if [ "${#picked[@]}" -gt 1 ]; then
            echo "::error::this PR has ${#picked[@]} siblings: labels; keep one"
            exit 1
          fi
          branch="test"
          if [ "${#picked[@]}" -eq 1 ]; then
            branch="${picked[0]}"
            if ! [[ "${branch}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
              echo "::error::the siblings: label on this PR does not name a branch"
              exit 1
            fi
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Check out the six tool repositories beside the hub (their test heads, or the labelled branch)
        working-directory: ..
        env:
          WANTED: ${{ steps.siblings.outputs.branch || 'test' }}
        run: |
          set -euo pipefail
          for repo in atrium-page-classification atrium-ocr-postprocess atrium-digital-convert \
                      atrium-nlp-enrich atrium-keyword-extract atrium-translator; do
            url="https://github.com/ufal/${repo}.git"
            branch="test"
            if [ "${WANTED}" != test ]; then
              # 2: the repository has no such branch, so `test`; anything else is a failure.
              found=0
              git ls-remote --quiet --exit-code --heads "${url}" "refs/heads/${WANTED}" > /dev/null || found=$?
              case "${found}" in
                0) branch="${WANTED}" ;;
                2) ;;
                *) exit "${found}" ;;
              esac
            fi
            git clone --quiet --depth 1 --branch "${branch}" "${url}" "${repo}"
            echo "::notice title=${repo}::checked out at ${branch} ($(git -C "${repo}" rev-parse --short HEAD))"
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # jsonschema is NOT optional here despite being an optional import in
      # atrium_document.py: test_document_originators.py ends by calling
      # validate_document() on a fully-built record (issue #10, D9), and without
      # jsonschema that call raises its own fail-loud RuntimeError. Installing
      # pytest alone would turn the newly promoted Layer D coverage into a red
      # job — or, worse, into a job that only exercises the degraded branch.
      #
      # PyYAML is equally non-optional, and for a sharper reason: `tests/` now holds
      # test_workflow_lint.py, which imports tools/ci/workflow_lint.py, which imports
      # yaml at MODULE level. A missing import there is a pytest COLLECTION error, and
      # a collection error aborts the ENTIRE session — so the 143 tests that had
      # nothing to do with it never ran either. Landed red on 2026-08-06 (run
      # 31115978804) for exactly this.
      #
      # fastapi, httpx2 and python-multipart: tests/test_atrium_service.py opens with
      # `pytest.importorskip("fastapi")`, so without them every test of the canonical
      # atrium_service.py -- the #55 lifecycle and, since #53, the harmonised error body
      # and the /info limits contract -- was SKIPPED here, green, testing nothing.
      # python-multipart is what an UploadFile/Form endpoint needs to even be declared.
      #
      # fastapi and pydantic are pinned to the versions the five tool repos pin exactly
      # (atrium-project#32 round 2): the gen-3 atrium_service.py tests assert the shape of the
      # OpenAPI document those two generate, and each repo's committed service/openapi.json is
      # a function of both. openapi-spec-validator validates the documents the tests build.
      # httpx2, not httpx: starlette's TestClient takes it when installed (httpx is deprecated
      # there), and nothing here imports httpx itself.
      #
      # ruff, at the version the tools' pre-commit runs: tests/test_shared_manifest.py checks the
      # shared ruff.toml with it and skipped its second half without it.
      - name: Install pytest, jsonschema, PyYAML, ruff and the FastAPI test stack
        run: >-
          pip install pytest jsonschema PyYAML ruff==0.15.18 fastapi==0.141.1 pydantic==2.13.5 httpx2
          python-multipart openapi-spec-validator

      # tests/test_atrium_openapi.py checks atrium_openapi.py's breaking-change rules against
      # the REAL oasdiff (the severity levels it raises, the anyOf-null normalisation) and
      # skips those tests without it; the rules were measured against this version, which is
      # also what every release.yml and api-contract.reusable.yml installs. `go install`
      # verifies the module against sum.golang.org; GOTOOLCHAIN=auto fetches the Go version
      # oasdiff's go.mod asks for.
      - name: Install oasdiff (atrium_openapi.OASDIFF_VERSION)
        env:
          OASDIFF_VERSION: v1.32.1
        run: |
          GOTOOLCHAIN=auto go install "github.com/oasdiff/oasdiff@${OASDIFF_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # tests/ holds the 16 check_version.py tests — the release gate for all
      # five tool repos, which had no tests anywhere in the ecosystem until #18.
      #
      # docs/templates/shared/ is run separately and from inside the directory,
      # because test_para_licenses.py imports its module as a plain
      # `from para_licenses import ...` and relies on pytest putting the test
      # file's own directory on sys.path — the same way it resolves once
      # vendored into a tool repo, where pytest.ini sets `pythonpath = .`.
      #
      # Those 36 tests had been in this repo the whole time, passing, and
      # invoked by nothing.
      #
      # Since issue #10 (D9) that directory also holds
      # test_document_originators.py, so this step is now what stops a
      # regression in _assert_origin_consistent() passing Hub Self-Check and
      # propagating to five repos on the next `v1` move — the hole G6 named.
      # -rs: every skip, with its reason, so a test that stops running shows in the log.
      - name: Run release-gate tests
        run: python -m pytest tests/ -v -rs

      - name: Run canonical shared-module tests
        working-directory: docs/templates/shared
        run: python -m pytest . -v -rs

  # atrium-project#71: the crates atrium_rocrate.py writes, checked by the RO-Crate validator
  # against the pair agreed with AMČR (RO-Crate 1.2, Process Run Crate 0.5), each profile in its
  # own run. The validator lives here and in the E2E only, never in a tool repo
  # (tools/ci/requirements-rocrate.txt says why); the module's --selftest stays the structural
  # check para-drift runs everywhere.
  rocrate-validate:
    name: Validate the RO-Crates (RO-Crate 1.2, Process Run Crate 0.5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/ci/requirements-rocrate.txt

      - name: Install the RO-Crate validator
        run: pip install -r tools/ci/requirements-rocrate.txt

      # The sample document crate, run crate, record fragment and service CreateAction, the
      # last two under a stub root. The profile is gated at SHOULD: the builder must meet all of
      # Process Run Crate, not only its two MUSTs.
      - name: Validate the module's sample crates
        run: python tools/ci/rocrate_check.py --samples "$RUNNER_TEMP/crates"
