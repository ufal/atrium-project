# atrium-project — E2E smoke for the BORN-DIGITAL route (record schema 2.0, atrium-project#84):
# digital-convert's published images write docproc, ocr-postprocess's build the record from it.
# Reasons and incident history: docs/decisions/e2e-lanes.md.
#
# The route since ARÚP's contract of 12 November 2026: digital-convert reads the original and writes
# its layout as docproc (`atr/docproc-json`) with a verdict for every page; it never refuses and
# never writes the record. ocr-postprocess builds the record from docproc (`build_record.py`,
# `POST /build_record`) and scores every line. A page digital-convert cannot use (an earlier OCR
# layer, a layer that does not decode, no text) is routed to the ATR; its text comes in the ATR's
# docproc, so building a record from digital-convert's docproc alone refuses it (`needs_atr`) until
# the merge of a mixed document (H6) is built.
#
# Two parts:
#   * the CLI cases: the `-digital` image writes docproc from each fixture and its AMČR seed;
#     tools/e2e/docproc_assert.py checks it (schema, routing, no run data); ocr-postprocess's batch
#     image builds the record (`python3 /app/build_record.py`, the entrypoint's interpreter rule,
#     not an override); tools/e2e/e2e_assert.py checks the record at schema 2.x;
#   * the services: digital-convert's `-api` `/reformat` and ocr-postprocess's `-api`
#     `/build_record`, chained, with both CreateActions checked (atrium_rocrate.action_problems).
#
# Fixtures are GENERATED, never committed, by digital-convert's deterministic, sha256-pinned
# tests/fixtures/digital/make_fixtures.py, with `--manifest` in the work dir: the generator
# rewrites its manifest, which would dirty the checkout (`assert-clean-tree`). The docproc schema
# comes from the same checkout (schemas/docproc/document.atrium-proposal.schema.json).
#
# Event-driven only (no schedule since 2026-11-14): a push to `main` that touches this lane runs
# `:test`; a dispatch runs the tag it names.

name: E2E Digital-Born Smoke Test

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: >-
          GHCR tag to exercise. `latest` = the last releases of digital-convert and
          ocr-postprocess; `test` = their pre-release channel. The preflight step reports a
          missing image and what unblocks it.
        type: choice
        options: [latest, test]
        default: latest
  push:
    branches: [main]
    paths:
      - ".github/workflows/e2e-digital-smoke.yml"
      - "tools/e2e/e2e_assert.py"
      - "tools/e2e/docproc_assert.py"
      - "tools/e2e/requirements.txt"

concurrency:
  group: e2e-digital-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Channel by EVENT: a push runs `:test` ("does what we are about to release still hold?"), a
  # dispatch what was chosen. A push must never run `:latest`: an edit to this file (on the `paths`
  # filter) cannot have produced that image. History: docs/decisions/e2e-lanes.md#image-channel-by-event
  IMAGE_TAG: ${{ inputs.image-tag || 'test' }}
  DIGITAL_IMAGE: ghcr.io/ufal/atrium-digital-convert-digital
  API_IMAGE: ghcr.io/ufal/atrium-digital-convert-api
  OCR_IMAGE: ghcr.io/ufal/atrium-ocr-postprocess
  OCR_API_IMAGE: ghcr.io/ufal/atrium-ocr-postprocess-api

jobs:
  digital-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      packages: read   # pull digital-convert's and ocr-postprocess's images from GHCR
      contents: read

    steps:
      # The default checkout, on purpose: this workflow lives in the hub, so tools/e2e/ comes from
      # the commit under test. Never pin it to another ref such as `v1`: the lane would then assert
      # with tooling that does not ship with it. History:
      # docs/decisions/e2e-lanes.md#hub-checkout-born-digital-lane
      - name: Checkout hub (assert scripts)
        uses: actions/checkout@v7

      - name: Set up Python for assertions
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/e2e/requirements.txt

      - name: Install e2e tooling dependencies
        run: pip install -r tools/e2e/requirements.txt

      # digital-convert is checked out for its fixture generator and its docproc schema only; the
      # converter under test is the published image. The ref follows the image channel: `test` for
      # `:test`, else the default branch (an empty ref).
      - name: Checkout atrium-digital-convert (fixture generator, docproc schema)
        uses: actions/checkout@v7
        with:
          repository: ufal/atrium-digital-convert
          ref: ${{ env.IMAGE_TAG == 'test' && 'test' || '' }}
          path: work/digital-convert-src

      # Pulls are authenticated: a GHCR package is PRIVATE on creation, so an anonymous pull of a
      # newly published image fails with `denied`.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Preflight: is there anything to test? ────────────────────────────────
      # A missing image would otherwise fail later as a daemon `denied`, which reads as a
      # permissions problem and is not one. An image from before record schema 2.0 has no
      # `--docproc-out`: it writes the record, and this lane has nothing to check on it.
      # History: docs/decisions/e2e-lanes.md#preflight
      - name: Preflight - confirm the images exist at the requested tag
        run: |
          set -uo pipefail
          missing=0
          check() {
            if docker manifest inspect "$1" >/dev/null 2>&1; then
              echo "  ok       $1"
            else
              echo "  MISSING  $1"
              missing=1
            fi
          }
          echo "Resolving images for tag '${IMAGE_TAG}':"
          check "${DIGITAL_IMAGE}:${IMAGE_TAG}"
          check "${OCR_IMAGE}:${IMAGE_TAG}"
          if [ "$missing" -ne 0 ]; then
            echo "::error::An image is not published at ':${IMAGE_TAG}'. The born-digital route cannot be smoked until both exist."
            {
              echo "### E2E digital-born smoke — no image to test"
              echo ""
              echo "This is a publication gap, not a credentials problem. To unblock, either:"
              echo ""
              echo "1. For \`image-tag: test\`: push the repository's \`test\` branch (the"
              echo "   \`build-and-push\` gate at \`v1\` publishes \`:test\` on it) and re-run; or"
              echo "2. For \`latest\`: cut a release, which publishes \`:latest\`."
              echo ""
              echo "Then mind the third gate: a GHCR package is PRIVATE on creation and owned by its"
              echo "tool repository, so this job's \`GITHUB_TOKEN\` cannot read it until the package is"
              echo "public, or grants \`ufal/atrium-project\` Read under *Manage Actions access*."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! docker run --rm "${DIGITAL_IMAGE}:${IMAGE_TAG}" --help 2>/dev/null | grep -q -- '--docproc-out'; then
            echo "::error::${DIGITAL_IMAGE}:${IMAGE_TAG} predates record schema 2.0 (no --docproc-out): it writes the record, not docproc (atrium-project#84)."
            exit 1
          fi

      - name: Create workspace
        run: |
          W="${{ github.workspace }}/work"
          mkdir -p "$W/digital_in" "$W/docproc" "$W/doc_json" "$W/records" "$W/paradata" "$W/api" \
                   "${{ github.workspace }}/hf-cache"
          chmod -R a+rwX "$W" "${{ github.workspace }}/hf-cache"

      - name: Generate the digital fixtures
        working-directory: work/digital-convert-src
        run: |
          set -euo pipefail
          W="${{ github.workspace }}/work"
          python3 tests/fixtures/digital/make_fixtures.py \
            --outdir "$W/digital_in" \
            --manifest "$W/digital_in/MANIFEST.json"
          python3 tests/fixtures/digital/make_fixtures.py \
            --outdir "$W/digital_in" \
            --manifest "$W/digital_in/MANIFEST.json" \
            --verify
          chmod -R a+rwX "$W/digital_in"
          ls -la "$W/digital_in"

      # ocr-postprocess scores every line with its perplexity model (D18 rule 1), downloaded from the
      # Hub on first use. The cache spares the download on a warm run; HF_TOKEN raises the anonymous
      # rate limit on a miss. History: docs/decisions/e2e-lanes.md#hugging-face-model-cache
      - name: Cache HuggingFace models (ocr-postprocess scoring)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/hf-cache
          key: e2e-hf-ocr-${{ env.IMAGE_TAG }}
          restore-keys: e2e-hf-ocr-

      - name: Prepare the HF cache mount
        run: chmod -R a+rwX "${{ github.workspace }}/hf-cache"

      # ── The CLI cases ───────────────────────────────────────────────────────────
      # Per fixture: its AMČR seed → digital-convert's docproc → docproc_assert.py → ocr-postprocess
      # builds and scores the record → e2e_assert.py at schema 2.x. A fixture whose pages go to the
      # ATR (garbled text layer, earlier OCR layer) is routed so and nothing refused; building the
      # record from that docproc alone fails (`needs_atr`) and writes nothing (D13), until H6.
      - name: Born-digital cases - docproc, then the record
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          SCHEMA=work/digital-convert-src/schemas/docproc/document.atrium-proposal.schema.json
          case_of() {  # $1 = fixture, $2 = media type, $3 = pages routed to the ATR (none/all), then e2e_assert flags
            local fixture="$1" media="$2" atr="$3"
            shift 3
            local name="${fixture%.*}" doc="AMCR-F-${fixture%.*}"
            echo "::group::${fixture}"
            mkdir -p "work/records/$name" "work/paradata/dc_$name" "work/paradata/ocr_$name"
            chmod a+rwX "work/records/$name" "work/paradata/dc_$name" "work/paradata/ocr_$name"
            python tools/e2e/make_seed.py "work/digital_in/$fixture" \
              --doc-id "$doc" --media-type "$media" --out "work/doc_json/$name.seed.json"
            docker run --rm -v "$GITHUB_WORKSPACE:/workspace" "${DIGITAL_IMAGE}:${IMAGE_TAG}" \
              "/workspace/work/digital_in/$fixture" \
              --document-json "/workspace/work/doc_json/$name.seed.json" \
              --docproc-out "/workspace/work/docproc/$name.docproc.json" \
              --paradata-dir "/workspace/work/paradata/dc_$name"
            python tools/e2e/docproc_assert.py "work/docproc/$name.docproc.json" \
              --schema "$SCHEMA" --expect-atr-pages "$atr"
            set +e
            docker run --rm -v "$GITHUB_WORKSPACE:/workspace" \
              -v "$GITHUB_WORKSPACE/hf-cache:/cache/huggingface" -e HF_TOKEN \
              "${OCR_IMAGE}:${IMAGE_TAG}" \
              python3 /app/build_record.py "/workspace/work/docproc/$name.docproc.json" \
              --seed "/workspace/work/doc_json/$name.seed.json" \
              --out-dir "/workspace/work/records/$name" \
              --paradata-dir "/workspace/work/paradata/ocr_$name"
            code=$?
            set -e
            if [ "$atr" = none ]; then
              [ "$code" -eq 0 ] || { echo "::error::${fixture}: build_record exited $code"; exit 1; }
              python tools/e2e/e2e_assert.py "work/records/$name/$doc.document.json" \
                --llm-stage-ran false --seed "work/doc_json/$name.seed.json" --require-current-major "$@"
            else
              [ "$code" -eq 1 ] || { echo "::error::${fixture}: a docproc with ATR pages must not build alone (exit 1), got $code"; exit 1; }
              [ ! -e "work/records/$name/$doc.document.json" ] || { echo "::error::${fixture}: a record was written anyway"; exit 1; }
              echo "✅ ${fixture}: routed to the ATR; the record waits for the ATR's docproc (needs_atr)"
            fi
            echo "::endgroup::"
          }
          case_of minimal.pdf application/pdf none
          case_of enrichable.pdf application/pdf none
          case_of two_column.pdf application/pdf none --expect-layout
          case_of rich.docx application/vnd.openxmlformats-officedocument.wordprocessingml.document none --expect-layout
          case_of garbled.pdf application/pdf all
          case_of ocr_layer.pdf application/pdf all

      # ── The services: digital-convert `-api`, then ocr-postprocess `-api` ─────────
      # What AMČR's Temporal activities call. Through the two services:
      #   * the seed survives into the record, and each response's `paradata` is a valid
      #     CreateAction naming its inputs and outputs by distribution name and SHA-512;
      #   * garbled.pdf comes back routed to the ATR, and /build_record refuses it alone (422
      #     `needs_atr`);
      #   * a seed whose sha512 is not the file's is 422 `source_digest_mismatch`.
      # A missing `-api` image is a warning: it reaches `:latest` only via a release.
      - name: The services - /reformat, then /build_record
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          for image in "${API_IMAGE}:${IMAGE_TAG}" "${OCR_API_IMAGE}:${IMAGE_TAG}"; do
            if ! docker pull "$image"; then
              echo "::warning::$image is not published yet (no release or test push at this tag); the service case is skipped."
              echo "**Skipped:** $image is not published yet; the service case is skipped." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          DC=$(docker run -d -e PORT=8080 -p 8080:8080 "${API_IMAGE}:${IMAGE_TAG}")
          OCR=$(docker run -d -e PORT=8081 -p 8081:8081 -e HF_TOKEN \
            -v "$GITHUB_WORKSPACE/hf-cache:/cache/huggingface" "${OCR_API_IMAGE}:${IMAGE_TAG}")
          cleanup() {
            local container
            for container in "$DC" "$OCR"; do
              docker logs "$container" 2>&1 | tail -30
              docker rm -f "$container" >/dev/null 2>&1
            done
          }
          trap cleanup EXIT
          for port in 8080 8081; do
            for _ in $(seq 1 300); do
              if curl -fsS "http://localhost:$port/ready" >/dev/null 2>&1; then break; fi
              sleep 2
            done
            curl -fsS "http://localhost:$port/ready" && echo
          done

          reformat() {  # $1 = response file, $2 = fixture, then extra -F parts; prints the HTTP status
            local out="$1" fixture="$2"
            shift 2
            curl -sS -o "$out" -w '%{http_code}' -X POST http://localhost:8080/reformat \
              -F "file=@${fixture};type=application/pdf" "$@"
          }
          build() {  # $1 = response file, $2 = docproc, then extra -F parts; prints the HTTP status
            local out="$1" docproc="$2"
            shift 2
            curl -sS -o "$out" -w '%{http_code}' -X POST http://localhost:8081/build_record \
              -F "docproc=@${docproc};type=application/json" "$@"
          }
          part() {  # $1 = 200 response file, $2 = its key, $3 = where it goes
            python -c 'import json, sys; json.dump(json.load(open(sys.argv[1], encoding="utf-8"))[sys.argv[2]], open(sys.argv[3], "w", encoding="utf-8"), ensure_ascii=False)' "$1" "$2" "$3"
          }
          expect() {  # $1 = expected status, $2 = expected reason or cause ("" for 200), $3 = response file, $4 = status answered
            local reason=""
            [ -z "$2" ] || reason=$(python -c 'import json, sys; b = json.load(open(sys.argv[1], encoding="utf-8")); print(b.get("cause") or b.get("reason"))' "$3")
            if [ "$4" != "$1" ] || [ "$reason" != "$2" ]; then
              echo "::error::expected $1${2:+ $2}, got $4: $(head -c 800 "$3")"
              exit 1
            fi
            echo "✅ $3: $1${2:+ $2}"
          }
          actions() {  # each response's CreateAction meets the shared contract; $@ = response files
            PYTHONPATH=docs/templates/shared python - "$@" <<'PY'
          import json
          import sys

          from atrium_rocrate import action_problems

          for path in sys.argv[1:]:
              action = json.load(open(path, encoding="utf-8")).get("paradata")
              problems = action_problems(action)
              assert not problems, f"{path}: the response's CreateAction: {problems}"
              names = sorted({e.get("name") for e in action.get("result") or []})
              print(f"✅ {path}: CreateAction {action['@id']} writes {names}")
          PY
          }
          SCHEMA=work/digital-convert-src/schemas/docproc/document.atrium-proposal.schema.json

          # The seeded happy path: docproc, then the record built from it and the same seed.
          code=$(reformat work/api/minimal.json work/digital_in/minimal.pdf \
            -F "document_json=@work/doc_json/minimal.seed.json;type=application/json")
          expect 200 "" work/api/minimal.json "$code"
          part work/api/minimal.json docproc work/api/minimal.docproc.json
          python tools/e2e/docproc_assert.py work/api/minimal.docproc.json --schema "$SCHEMA" --expect-atr-pages none
          code=$(build work/api/minimal.record.json work/api/minimal.docproc.json \
            -F "document_json=@work/doc_json/minimal.seed.json;type=application/json")
          expect 200 "" work/api/minimal.record.json "$code"
          part work/api/minimal.record.json document_json work/api/minimal.document.json
          python tools/e2e/e2e_assert.py work/api/minimal.document.json \
            --llm-stage-ran false --seed work/doc_json/minimal.seed.json --require-current-major
          actions work/api/minimal.json work/api/minimal.record.json

          # A page for the ATR: routed so, and not built alone.
          code=$(reformat work/api/garbled.json work/digital_in/garbled.pdf)
          expect 200 "" work/api/garbled.json "$code"
          part work/api/garbled.json docproc work/api/garbled.docproc.json
          python tools/e2e/docproc_assert.py work/api/garbled.docproc.json --schema "$SCHEMA" --expect-atr-pages all
          code=$(build work/api/garbled.record.json work/api/garbled.docproc.json -F doc_id=AMCR-F-garbled)
          expect 422 needs_atr work/api/garbled.record.json "$code"

          # A seed whose sha512 is not the file's digest.
          python - <<'PY'
          import json

          seed = json.load(open("work/doc_json/minimal.seed.json", encoding="utf-8"))
          digest = seed["source"]["sha512"]
          seed["source"]["sha512"] = ("1" if digest[0] == "0" else "0") + digest[1:]
          json.dump(seed, open("work/api/wrong_digest.seed.json", "w", encoding="utf-8"))
          PY
          code=$(reformat work/api/wrong_digest.json work/digital_in/minimal.pdf \
            -F "document_json=@work/api/wrong_digest.seed.json;type=application/json")
          expect 422 source_digest_mismatch work/api/wrong_digest.json "$code"

      # atrium-project#81 (policy rule 8) and #77: which build of each image ran, by digest.
      - name: Record the images of this run
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 tools/e2e/e2e_manifest.py --lane digital --tag "$IMAGE_TAG" --status "$JOB_STATUS" \
            --image "${DIGITAL_IMAGE}:${IMAGE_TAG}" \
            --image "${API_IMAGE}:${IMAGE_TAG}" \
            --image "${OCR_IMAGE}:${IMAGE_TAG}" \
            --image "${OCR_API_IMAGE}:${IMAGE_TAG}" \
            --out work/e2e-manifest.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the image manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-manifest-digital
          path: work/e2e-manifest.json
          if-no-files-found: warn

      - name: Upload the outputs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-digital-outputs
          path: |
            work/docproc/*.json
            work/records/
            work/doc_json/*.json
            work/api/*.json
            work/paradata/
            work/digital_in/MANIFEST.json
          if-no-files-found: warn
