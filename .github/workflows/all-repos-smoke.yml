# atrium-project — cross-repo fast-lane matrix.
#
# Runs each tool repo's own `-m "not slow"` suite against its default branch, so a
# hub-side change (a moved `v1`, an edited canonical template) is caught against all
# five repos at once rather than one repo at a time.
#
# ⚠️ This is NOT the JSON pipeline end-to-end test. That is `e2e-pipeline-smoke.yml`,
# which threads a real `atrium_document` record through all five published container
# images and asserts the accretion contract. This file only runs unit suites.
#
# Issue #10, G10 — everything below was wrong before this rewrite:
#   * It was called "Reusable E2E Pipeline Smoke (JSON Matrix)" and shared the real
#     E2E's cron, but threaded no document JSON at all. A reader comparing the two
#     names would reasonably conclude the JSON path had redundant coverage. It did not.
#   * `llm-enrich` was missing from the matrix — the one repo whose engine had no
#     direct tests until 2026-07-22, and the owner of `enrichment`/`forms`.
#   * No `-m "not slow"`, so it tried to run model/GPU/network tests that no runner
#     here can serve. Every repo's own `docker.yml` filters them; this did not.
#   * `--maxfail=1` stopped at the first failure, so one broken repo hid the state of
#     the rest — the opposite of what a cross-repo matrix is for.
#   * No `timeout-minutes`, no `concurrency`, no `permissions` (the three policy
#     blocks `workflow_lint.py` enforces everywhere else), and it sat two major
#     versions behind the action floor (checkout@v5 / setup-python@v6 vs @v7).
#   * `workflow_call` was declared with no inputs and no caller anywhere.

name: Cross-Repo Fast-Lane Matrix

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # 04:00, NOT 02:00: e2e-pipeline-smoke.yml already holds '0 2 */3 * *', and this
    # workflow's own header lists that collision as one of the defects it fixed —
    # it had been reintroduced. Both jobs are heavy (the E2E pulls five images over
    # ~40 min; this matrix runs five pip installs + suites over ~20 min), so
    # colliding them contends for runners and interleaves two unrelated failure
    # reports in the same digest window.
    - cron: '0 4 */3 * *' # 04:00 on every 3rd day-of-month, 2h after the E2E

permissions:
  contents: read

concurrency:
  group: all-repos-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-lane:
    name: ${{ matrix.repo }} fast lane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Never fail-fast: the point is a full picture of all five repos in one run.
      fail-fast: false
      matrix:
        repo:
          - page-classification
          - alto-postprocess
          - translator
          - nlp-enrich
          - llm-enrich

    steps:
      - name: Checkout ufal/atrium-${{ matrix.repo }}
        uses: actions/checkout@v7
        with:
          repository: ufal/atrium-${{ matrix.repo }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Repos differ in layout: page-classification and alto-postprocess keep
          # their manifests under setup/, the other three at the root. Install
          # whichever exist. Runtime requirements come first because several test
          # modules import the real package they exercise.
          for f in requirements.txt setup/requirements.txt \
                   service/requirements.txt \
                   requirements-test.txt setup/requirements-test.txt; do
            if [ -f "$f" ]; then
              echo "::group::pip install -r $f"
              pip install -r "$f"
              echo "::endgroup::"
            fi
          done

      - name: Run fast lane
        # `-m "not slow"` is the ecosystem-wide contract for "no model, no GPU, no
        # network" (every repo's pytest.ini declares the marker). No --maxfail: a
        # cross-repo matrix should report every repo's real state in one pass.
        run: pytest -m "not slow" --disable-warnings
