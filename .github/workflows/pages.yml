# atrium-project — build the aggregate documentation site and publish it (issue #57).
#
# WHY THIS FILE EXISTS. On 2026-09-21 Pages was switched on for this repository
# with the source set to `main` / `/docs` and the legacy Jekyll builder. That build
# fails (run 35582651532):
#
#   Liquid Exception: Liquid syntax error (line 79): Variable
#   '{{ matrix.target != 'base' && format('-{0}'  was not properly terminated
#   with regexp: /\}\}/  in docker_gha_roadmap.md
#
# Jekyll runs Liquid over ALL markdown -- including fenced blocks and code spans --
# so the GitHub Actions expression quoted at docs/docker_gha_roadmap.md:79 is read as
# a template variable. There are nine such occurrences across two hub files.
#
# THAT FAILURE WAS LOAD-BEARING, AND IS NO LONGER. `/docs` is the hub's canonical
# internal tree, so a GREEN Jekyll build from it would have published
# docs/arub-p_contacts.md (five ARUP/ARUB partner email addresses),
# docs/plan_repo_review.md and the 97 KB internal docker_gha_roadmap.md -- the build
# log reaches `Rendering: arub-p_contacts.md` and dies four files later. Nothing was
# published only because it crashed, which is an accident, not a safeguard.
#
# `docs/_config.yml` now excludes those three plus docker_gha.md (whose one
# `{{version}}` resolves to the empty string rather than raising, shipping a
# silently wrong line) and `templates/` (vendored code, not documentation). The
# legacy build is green and publishes nine reviewed files; `tests/test_docs_pages_exclude.py`
# fails if anything new appears under docs/ that is neither excluded nor reviewed.
# Both are stopgaps and should be deleted once the Pages source moves. See
# PAGES_SETUP.md.
#
# WHAT THIS WORKFLOW DOES INSTEAD. It builds the aggregate site with MkDocs Material
# and publishes the RESULT to `gh-pages`, which is where the other five repositories
# already publish from and what mkdocs.yml and PAGES_SETUP.md settled on. The branch
# carries only built HTML, so nothing under docs/ can reach the site by accident.
#
# `actions/configure-pages` is deliberately NOT used. Its `findOrCreatePagesSite`
# GETs the existing site first and returns it, so on a repository where Pages is
# already enabled as a branch source it never POSTs `build_type: workflow`. It cannot
# repoint this repository; one owner-level dropdown change does. PAGES_SETUP.md has
# the exact step.
#
# Every event builds with `--strict`; only a push to `main` deploys. The daily cron
# is the 07:00 slot 57.plan.md A.4 reserved, staggered off the existing 02:00 /
# 04:00 / 05:15 / 05:30 / 05:45 / 06:00 slots -- a tool repo's docs change cannot
# notify the hub (no cross-repo token exists here), so the hub re-reads on a timer.

name: Documentation Site

on:
  workflow_dispatch:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  schedule:
    # 07:00 daily. Staggered off every other scheduled slot in this repository.
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  # Keep different trigger classes independent. Within the same trigger/ref,
  # do not cancel an earlier run because a deployment must not race another
  # deployment to the gh-pages branch.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the aggregate site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # The build only needs read access. Write access is required by the
      # gh-deploy step to update the generated gh-pages branch.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Keep the full repository history so gh-deploy can work reliably with
          # an existing gh-pages branch, including after branch resets.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/docs/requirements.txt

      - name: Install the documentation toolchain
        env:
          # PyPI occasionally takes longer than pip's default 15-second socket
          # timeout. The failed run hit this condition while resolving `click`;
          # the reported ResolutionImpossible was a consequence of the timeout,
          # not a real MkDocs dependency conflict.
          PIP_DEFAULT_TIMEOUT: "60"
          PIP_RETRIES: "10"
        run: |
          python -m pip install \
            --disable-pip-version-check \
            -r tools/docs/requirements.txt

      - name: Build the site
        # `--strict` promotes MkDocs warnings to build failures, so broken
        # configuration, navigation and other documented warnings cannot be
        # silently published.
        run: mkdocs build --strict

      - name: Publish to gh-pages
        # Only a push to the default branch deploys. PRs, pushes to `test`, the
        # cron and manual dispatches build and stop -- making the workflow both
        # a validation gate and a deployment workflow.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --force: gh-pages is generated output and is never merged into.
          # --no-history: keep one deployment commit instead of accumulating the
          # complete generated-site history. Nothing consumes that history.
          # ghp-import creates .nojekyll, so Pages serves the generated tree
          # directly instead of running Jekyll over it.
          mkdocs gh-deploy --force --no-history

      - name: Where the site went
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "### Documentation site"
            echo
            echo "Built from \`docs_site/\` and pushed to \`gh-pages\`."
            echo
            echo "It serves at <https://ufal.github.io/atrium-project/> once an owner"
            echo "points Settings → Pages at \`gh-pages\` / \`/ (root)\`."
            echo
            echo "Until that Pages source change is made, the repository's existing"
            echo "Pages configuration remains \`main\` / \`/docs\` with Jekyll."
            echo "See \`PAGES_SETUP.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
