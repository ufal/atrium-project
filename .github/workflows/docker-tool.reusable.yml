# Reusable workflow the ATRIUM tool repositories call to test, build, probe and publish images.
#   test                pytest with coverage; skips reported; tests must not change tracked files
#   docker-build-smoke  build every target; start each probe target: health, port, logs, SIGTERM
#   build-and-push      push by digest, scan, then promote the release tags (tag, `test` push)
#   images              on a version tag, the digest each promoted tag resolves to (images-json)
# The caller caps every job's permissions. Reasons and incident history:
# docs/decisions/docker-tool-reusable.md; the workflow set: docs/docker_gha.md.
name: ATRIUM Docker Tool Template

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      apt-packages:
        required: false
        type: string
        default: ""
      pre-install-torch:
        required: false
        type: string
        default: ""
      requirements:
        required: false
        type: string
        default: "requirements.txt requirements-test.txt"
      torch-index-url:
        description: >-
          Wheel index for the pre-install-torch step. Defaults to the CPU index,
          which was hardcoded before and made a CUDA build impossible to request
          from a caller (#18).
        required: false
        type: string
        default: "https://download.pytorch.org/whl/cpu"
      hf-model-cache:
        required: false
        type: boolean
        default: false
      hf-cache-key:
        description: >-
          Model revision the HF cache is keyed on, e.g. "v4.3". Set this to the
          same pin the tool passes to `-rev` / bakes into its Dockerfile CMD, so
          the cache invalidates when the MODEL changes and not when source does.
          Only meaningful with hf-model-cache: true.
        required: false
        type: string
        default: ""
      build-targets:
        required: false
        type: string
        default: '["base"]'
      probe-targets:
        description: >-
          Subset of build-targets that are actually runnable servers, container-smoke
          tested in docker-build-smoke (issue #55): `docker run`, wait for Docker's own
          HEALTHCHECK to report healthy, GET /health and /ready over the published port,
          then `docker stop` (SIGTERM) and assert a clean exit inside the grace period.
          Default '[]' is a deliberate no-op on adoption — most build-targets are batch
          CLIs (ENTRYPOINT ["python", "run_pipeline.py"] and similar), and probing one
          would fail correctly-behaving images that were never meant to serve HTTP.
          Pass the server-shaped targets explicitly, e.g. '["api"]'. Assumes the probed
          image EXPOSEs 8000 and answers GET /health — true of every ATRIUM api stage.
          Where the repo commits service/openapi*.json and vendors atrium_openapi.py, the
          probe also checks that the served /openapi.json is a committed spec and that
          /info openapi_sha256 is its digest (atrium-project#32 round 2).
        required: false
        type: string
        default: '[]'
      forbidden-distributions:
        description: >-
          JSON list of Python distributions a probed image (probe-targets) must not have
          installed (atrium-project#72). The default names PyMuPDF: AGPL-3.0, and undeclared
          in page-classification until pypdfium2 replaced it, so an image that brings it back
          fails here rather than in a licence review. A repository adds to it only with a
          reason; `[]` switches the check off.
        required: false
        type: string
        default: '["pymupdf"]'
      forbidden-modules:
        description: >-
          JSON list of top-level modules that must not be importable inside a probed image,
          first-party ones included (the probe runs in the image's WORKDIR). For code a tracked
          move takes out of an image, e.g. '["llm_utils"]' in nlp-enrich until
          atrium-keyword-extract#1 has taken it out; the image-closure check of workflow-lint covers what the
          entrypoint imports, this covers what the image contains.
        required: false
        type: string
        default: '[]'
      assert-clean-tree:
        description: >-
          Fail the test job if the suite modified any TRACKED file (W6). A suite that
          rewrites committed fixtures is a build step with assertions, and the mutation
          lands in whoever commits next — nlp-enrich's suite reordered
          data_samples/manifest.tsv on every run. Set false only for a repo with a
          documented, deliberate reason to write into its own tree during tests.
        required: false
        type: boolean
        default: true
      max-skips:
        description: >-
          Maximum number of skipped tests tolerated before the job fails (W6).
          -1 (default) reports the count and reasons without enforcing a ceiling, so
          this is non-breaking on adoption; set a real number to ratchet a repo down
          once its skips are understood.
        required: false
        type: number
        default: -1
      release-gate:
        description: >-
          Publish only images whose container probe passed (atrium-project#81). With true,
          build-and-push waits for docker-build-smoke and runs only when every leg of it
          succeeded, so a failed probe pushes and promotes nothing, for any target: a release
          never ships part of its images. With false (the default), build-and-push still waits
          for the probe but runs whatever it found, which is the behaviour before #81. A
          repository turns it on in the release workflow that certifies its image
          (docs/ci_policy.md, Releases).
        required: false
        type: boolean
        default: false
      simulate-probe-failure:
        description: >-
          Make the container probe fail on purpose, with a line in the summary saying so. For
          demonstrating release-gate (atrium-project#81) from a dispatched dry run; never set it
          on a tag.
        required: false
        type: boolean
        default: false
    outputs:
      images-json:
        description: >-
          On a version tag, after every target was promoted: a JSON object naming the source
          (repository, tag, commit) and, per target, the image, the tag and the digest that tag
          resolves to in GHCR (atrium-project#81). Empty on any other event. A release workflow
          writes it to images.json and attaches it.
        value: ${{ jobs.images.outputs.images-json }}
    secrets:
      # Only the secret this workflow uses is declared, so callers need no `secrets: inherit`, which
      # hands over every secret of the calling repository (#18). GITHUB_TOKEN is provided
      # automatically and must NOT be declared: GitHub rejects it as a workflow_call secret name.
      CODECOV_TOKEN:
        description: "Codecov upload token. Omit to skip the upload step."
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Least privilege (#10, G8): with no block, a reusable workflow's job inherits the caller's
    # default scope, and this job runs the caller's whole test suite. Codecov has its own token.
    permissions:
      contents: read
    env:
      # In the job env so the Codecov step's `if:` can see it; `env.*` cannot read `secrets` (#18).
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache HuggingFace Models
        if: inputs.hf-model-cache == true
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          # Keyed on the caller's model revision (hf-cache-key), not on source files: a code edit
          # keeps the cache, a model change invalidates it (#18).
          key: hf-models-${{ inputs.hf-cache-key != '' && inputs.hf-cache-key || 'default' }}
          restore-keys: hf-models-

      # The three steps below take inputs through `env:`, not `${{ inputs.* }}` inside `run:`
      # (the pattern actionlint and CodeQL flag); quoting "$VAR" also stops re-splitting (#18).
      - name: Install APT packages
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 — word splitting is intended: a package list
          sudo apt-get install -y $APT_PACKAGES

      - name: Pre-install PyTorch
        if: inputs.pre-install-torch != ''
        env:
          TORCH_SPEC: ${{ inputs.pre-install-torch }}
          TORCH_INDEX_URL: ${{ inputs.torch-index-url }}
        run: |
          # shellcheck disable=SC2086 — TORCH_SPEC may name several packages
          pip install $TORCH_SPEC --index-url "$TORCH_INDEX_URL"

      - name: Install dependencies
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          for req in $REQUIREMENTS; do
            if [ -f "$req" ]; then pip install -r "$req"; fi
          done
          # No `ruff` here: its advisory run was removed (see below), and the
          # pre-commit reusable owns the lint gate.
          pip install pytest pytest-cov

      - name: Prepare environment
        run: if [ -f ".env.example" ]; then cp .env.example .env; fi

      # No lint step: pre-commit.reusable.yml runs ruff as a blocking check (W6, roadmap E7).

      - name: Test & Coverage
        env:
          PYTHONPATH: .
        # `-rs` lists every skipped test with its reason: a skipped test is an untested module with
        # a green tick. `tee` keeps this run's own summary for the skip step below; re-collecting
        # would re-evaluate skipif markers and could disagree with this run.
        run: |
          set -o pipefail
          python -m pytest -m "not slow" -rs \
            --cov=. --cov-report=term-missing --cov-report=xml \
            | tee pytest-output.txt

      # W6: report the skip count; `max-skips` sets a ceiling (-1, the default, only reports).
      - name: Skipped-test visibility
        if: always()
        env:
          MAX_SKIPS: ${{ inputs.max-skips }}
        run: |
          set -uo pipefail
          if [ ! -f pytest-output.txt ]; then
            echo "no pytest output captured (the test step did not run) — nothing to report"
            exit 0
          fi
          # pytest's terminal summary, e.g. "== 296 passed, 8 skipped in 12.3s =="
          COUNT=$(sed -n 's/.*[^0-9]\([0-9]\+\) skipped.*/\1/p' pytest-output.txt | tail -1)
          COUNT=${COUNT:-0}
          {
            echo "### Skipped tests"
            echo ""
            echo "Skipped: **${COUNT}** (ceiling: \`${MAX_SKIPS}\`; \`-1\` = report only)"
            echo ""
            if [ "${COUNT}" -gt 0 ]; then
              echo '```text'
              grep '^SKIPPED' pytest-output.txt || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${MAX_SKIPS}" != "-1" ] && [ "${COUNT}" -gt "${MAX_SKIPS}" ]; then
            echo "::error::${COUNT} skipped tests exceeds the configured ceiling of ${MAX_SKIPS}."
            exit 1
          fi

      # W6: a suite that changes tracked files is a build step with assertions. Fail it here, in
      # the one workflow every tool repository shares (input assert-clean-tree).
      - name: Assert the working tree is unchanged by the tests
        if: always() && inputs.assert-clean-tree
        run: |
          set -euo pipefail
          # Untracked build/coverage output is expected; only TRACKED files matter.
          DIRTY=$(git status --porcelain --untracked-files=no)
          if [ -n "$DIRTY" ]; then
            echo "::error::The test run modified tracked files. Tests must not mutate the repository."
            echo "$DIRTY"
            echo "--- diff ---"
            git --no-pager diff -- . | head -200
            exit 1
          fi
          echo "working tree clean — tests did not mutate tracked files"

      - name: Coverage to Step Summary
        if: always()
        # ci-optional: an informational summary; the test step above decides the job
        continue-on-error: true
        run: |
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python -m coverage combine 2>/dev/null || true
          python -m coverage report >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-build-smoke:
    # Runs on pull requests, dispatch, `test` pushes and version tags, so it probes what
    # build-and-push publishes (W3). build-and-push needs this job: with release-gate, a failed
    # leg publishes nothing (#81). Dispatch lets a release dry run exercise the gate.
    # History: docs/decisions/docker-tool-reusable.md#when-the-probe-runs
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/test')
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Least privilege (#10, G8): builds but never pushes; build-and-push holds packages: write.
    permissions:
      contents: read
    strategy:
      # The targets are independent images: one broken target must not hide the others (#10).
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.build-targets) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        # Booting the container driver pulls moby/buildkit from Docker Hub, and a transient error
        # there would fail the job. continue-on-error lets the next step retry once; the retry tests
        # `outcome` (the result before continue-on-error) and is not continue-on-error itself, so a
        # real outage still fails. History: docs/decisions/docker-tool-reusable.md#buildx-boot-retry
        # ci-optional: the next step retries once, without continue-on-error
        continue-on-error: true

      - name: Set up Docker Buildx (retry after a transient registry failure)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      - name: Smoke Build
        # SHA-pinned (#18): build actions execute arbitrary build logic and, in the
        # publishing job below, hold registry push credentials.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          # Every ATRIUM Dockerfile names its first stage `AS base`, so the target passes verbatim
          # (mapping `base` to '' would build the LAST stage, the wrong image in multi-stage repos).
          target: ${{ matrix.target }}
          push: false
          # load: true puts the image into the runner's Docker daemon so the probe steps (#55) can
          # start it. Single-platform, as every ATRIUM image is linux/amd64 (roadmap H8).
          load: true
          tags: atrium-smoke/${{ inputs.image-name }}:${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The probed image carries no forbidden package (atrium-project#72)
        # "No production image depends on the undeclared AGPL dependency" (#72), checked in the
        # image itself rather than in its requirements files, which is where it would be missed:
        # a transitive dependency or a stray `pip install` reaches the image without touching a
        # requirements file. Also the place a finished repository move proves its code left the
        # image (forbidden-modules). Runs python inside the image, nothing is started.
        if: contains(fromJSON(inputs.probe-targets), matrix.target)
        env:
          IMAGE: atrium-smoke/${{ inputs.image-name }}:${{ matrix.target }}
          FORBIDDEN_DISTRIBUTIONS: ${{ inputs.forbidden-distributions }}
          FORBIDDEN_MODULES: ${{ inputs.forbidden-modules }}
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint python \
            -e FORBIDDEN_DISTRIBUTIONS -e FORBIDDEN_MODULES "$IMAGE" - <<'PY'
          import importlib.metadata, importlib.util, json, os, sys

          found = []
          for name in json.loads(os.environ.get("FORBIDDEN_DISTRIBUTIONS") or "[]"):
              try:
                  found.append(f"distribution {name} {importlib.metadata.version(name)} is installed")
              except importlib.metadata.PackageNotFoundError:
                  pass
          for module in json.loads(os.environ.get("FORBIDDEN_MODULES") or "[]"):
              if importlib.util.find_spec(module) is not None:
                  found.append(f"module {module} is importable")
          for line in found:
              print(f"::error::{line} in the image")
          print("forbidden packages: none found" if not found else f"{len(found)} forbidden package(s)")
          sys.exit(1 if found else 0)
          PY

      - name: Share one model cache across the probe containers
        # Each probe step starts a fresh container: an image that downloads models at warm-up would
        # do so in every step and can overrun the HEALTHCHECK budget. One named volume at HF_HOME
        # (Docker seeds it from the image, ownership included) lets the first container pay for it.
        # History: docs/decisions/docker-tool-reusable.md#shared-model-cache
        if: contains(fromJSON(inputs.probe-targets), matrix.target)
        env:
          IMAGE: atrium-smoke/${{ inputs.image-name }}:${{ matrix.target }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          hf_home=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" \
            | sed -n 's/^HF_HOME=//p' | head -n 1)
          if [ -z "$hf_home" ]; then
            echo "the image sets no HF_HOME: the probe containers share no model cache"
            exit 0
          fi
          volume="atrium-smoke-hf-${TARGET}"
          docker volume create "$volume" >/dev/null
          # One argument, so the four `docker run` lines below take it as
          # ${SMOKE_CACHE_MOUNT:+"$SMOKE_CACHE_MOUNT"}: nothing when unset, one quoted word when set.
          echo "SMOKE_CACHE_MOUNT=--volume=${volume}:${hf_home}" >> "$GITHUB_ENV"
          echo "the probe containers share the model cache: volume ${volume} at ${hf_home}"

      - name: Run container and wait for HEALTHCHECK (issue #55)
        # The one step that starts a container and watches it behave: HEALTHCHECK, log format,
        # /health, /ready, the served spec, SIGTERM. Opt-in per target: most are batch CLIs.
        if: contains(fromJSON(inputs.probe-targets), matrix.target)
        env:
          IMAGE: atrium-smoke/${{ inputs.image-name }}:${{ matrix.target }}
        run: |
          set -euo pipefail
          cid=$(docker run -d ${SMOKE_CACHE_MOUNT:+"$SMOKE_CACHE_MOUNT"} -p 18080:8000 "$IMAGE")
          echo "container: $cid"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          echo "Waiting up to 5.5 minutes for Docker's own HEALTHCHECK to report healthy..."
          # Docker's own Health.Status: a wrong probe path or a missing interpreter shows here. The
          # budget (docs/docker_gha.md §3.4: --start-period=180s --interval=30s --retries=3) must
          # cover the UNHEALTHY verdict: 180 + 3x30 = 270s, plus one interval of slack = 330s.
          deadline=$((SECONDS + 330))
          status="starting"
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            if [ "$status" = "unhealthy" ]; then
              echo "container reported unhealthy before ever becoming healthy" >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$status" != "healthy" ]; then
            echo "container did not report healthy within the timeout (last status: $status)" >&2
            exit 1
          fi
          echo "container is healthy"

          # (issue #61) Control for the LOG_LEVEL=WARNING step below: at the default level, start-up
          # must have logged a record in the agreed "%(asctime)s %(levelname)s %(name)s %(message)s"
          # shape, or that step would pass because nothing is logged at all. Any of the five levels
          # counts: the invariant is the formatter, not a clean warm-up (a backend without its CI
          # secret logs its warm-up failure at WARNING).
          LEVEL_ALLOWLIST='(DEBUG|INFO|WARNING|ERROR|CRITICAL)'
          # Polled: some services keep logging for a few seconds after the first `healthy`.
          log_deadline=$((SECONDS + 15))
          matched=0
          while [ "$SECONDS" -lt "$log_deadline" ]; do
            if docker logs "$cid" 2>&1 | grep -qE "^[0-9-]+ [0-9:,]+ ${LEVEL_ALLOWLIST} [^ ]+ "; then
              matched=1
              break
            fi
            sleep 1
          done
          if [ "$matched" -ne 1 ]; then
            echo "no record in the agreed log shape found at the default LOG_LEVEL -- either" >&2
            echo "nothing is logging through the configured root logger, or the" >&2
            echo "format string drifted from the agreed shape (issue #61)" >&2
            exit 1
          fi
          echo "confirmed: a record reaches stdout in the agreed shape at the default LOG_LEVEL"

          echo "Probing /health and /ready over the published port..."
          curl -sf http://127.0.0.1:18080/health
          echo
          curl -s -o /dev/null -w "/ready http_code: %{http_code}\n" http://127.0.0.1:18080/ready

          # (atrium-project#32 round 2) The served /openapi.json must equal a committed
          # service/openapi*.json (info.version aside: it is stamped at release time), matched by
          # content, and /info `openapi_sha256` must be its digest: the check AMČR runs against a
          # deployed image. Skipped where the repo has not adopted the typed contract yet.
          if ls service/openapi*.json >/dev/null 2>&1 && [ -f atrium_openapi.py ]; then
            echo "Comparing the served OpenAPI document with the committed one..."
            curl -sf http://127.0.0.1:18080/openapi.json -o "$RUNNER_TEMP/served.openapi.json"
            curl -sf http://127.0.0.1:18080/info -o "$RUNNER_TEMP/served.info.json"
            python3 - "$RUNNER_TEMP/served.openapi.json" "$RUNNER_TEMP/served.info.json" <<'PY'
          import glob
          import sys

          sys.path.insert(0, ".")
          import atrium_openapi  # the caller's vendored copy: stdlib only

          served = atrium_openapi.load(sys.argv[1])
          info = atrium_openapi.load(sys.argv[2])
          results = {path: atrium_openapi.check(atrium_openapi.load(path), served) for path in sorted(glob.glob("service/openapi*.json"))}
          matched = [path for path, problems in results.items() if not problems]
          if not matched:
              for path, problems in results.items():
                  print(f"::error::the served /openapi.json is not {path} (committed → served):")
                  for problem in problems:
                      print(f"  {problem}")
              sys.exit(1)
          expected = atrium_openapi.digest(served)
          if info.get("openapi_sha256") != expected:
              print(f"::error::/info openapi_sha256 is {info.get('openapi_sha256')!r}, not the served spec's digest {expected}")
              sys.exit(1)
          print(f"OK: the served spec is {matched[0]}; /info openapi_sha256 = {expected}")
          PY
          else
            echo "no committed service/openapi*.json or no atrium_openapi.py: skipping the spec comparison"
            echo "**Skipped (${{ matrix.target }}):** the served-vs-committed OpenAPI comparison — no committed \`service/openapi*.json\` or no \`atrium_openapi.py\`." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Sending SIGTERM (docker stop) and asserting a clean, timely exit..."
          # The budget must EXCEED the graceful-shutdown budget the service is entitled to
          # (GRACEFUL_SHUTDOWN_S=20 for uvicorn, a connection drain defaulting to 25s), or the probe
          # kills a correct container and blames it. This asserts "SIGTERM alone is enough", not
          # "shutdown is fast".
          stop_budget=30
          start=$SECONDS
          docker stop --time "$stop_budget" "$cid" >/dev/null
          elapsed=$((SECONDS - start))
          exit_code=$(docker inspect --format='{{.State.ExitCode}}' "$cid")
          echo "stopped in ${elapsed}s, exit code ${exit_code}"
          if [ "$elapsed" -ge "$stop_budget" ]; then
            echo "container needed SIGKILL — SIGTERM alone did not stop it in time" >&2
            exit 1
          fi
          # 143 = 128 + SIGTERM: the expected code for a process that caught the signal
          # and exited in response to it — uvicorn's own capture_signals() deliberately
          # re-raises the captured signal after a graceful exit so a supervisor sees
          # exactly this, not a faked 0. A service that explicitly reports a clean exit
          # instead is also accepted.
          if [ "$exit_code" != "143" ] && [ "$exit_code" != "0" ]; then
            echo "unexpected exit code $exit_code (expected 143, the SIGTERM exit code," >&2
            echo "or 0 for a service that deliberately reports a clean exit)" >&2
            exit 1
          fi
          echo "clean SIGTERM shutdown confirmed"

      - name: Simulated probe failure (simulate-probe-failure, atrium-project#81)
        # The demonstration of release-gate: a dispatched dry run with this input set must end
        # with nothing pushed and no release. Runs after the real probe, so the run also shows
        # that the image itself was healthy.
        if: inputs.simulate-probe-failure && contains(fromJSON(inputs.probe-targets), matrix.target)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "::error::simulate-probe-failure is set: the probe of ${TARGET} fails on purpose (atrium-project#81)"
          echo "**Simulated failure (${TARGET}):** \`simulate-probe-failure\` is set, so this probe fails on purpose; with \`release-gate\` nothing is published." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Run container on a NON-DEFAULT port (issue #58)
        # A second, shorter start proving $PORT is honoured (#58); the default-port step stays as it
        # is. `healthy` is the assertion: the in-container HEALTHCHECK builds its URL from $PORT. A
        # regression shows as a ~5.5-minute TIMEOUT, not an immediate error.
        if: contains(fromJSON(inputs.probe-targets), matrix.target)
        env:
          IMAGE: atrium-smoke/${{ inputs.image-name }}:${{ matrix.target }}
        run: |
          set -euo pipefail
          cid=$(docker run -d ${SMOKE_CACHE_MOUNT:+"$SMOKE_CACHE_MOUNT"} -e PORT=9000 -p 18080:9000 "$IMAGE")
          echo "container: $cid (PORT=9000)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          echo "Waiting for HEALTHCHECK to report healthy with PORT=9000..."
          # Same 330s budget and the same reasoning as the default-port step above
          # (--start-period 180s + 3 x --interval 30s, plus one interval of slack).
          deadline=$((SECONDS + 330))
          status="starting"
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            if [ "$status" = "unhealthy" ]; then
              echo "container reported unhealthy at PORT=9000: the in-container probe" >&2
              echo "could not reach the listener. Either \$PORT is not being honoured, or the" >&2
              echo "service had not finished starting (its warm-up) within the HEALTHCHECK" >&2
              echo "budget; the container log below shows which" >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$status" != "healthy" ]; then
            echo "container did not report healthy at PORT=9000 within the timeout" >&2
            echo "(last status: $status). The listener is almost certainly still on the" >&2
            echo "default port while service/healthcheck.py probes \$PORT — i.e. the" >&2
            echo "api stage no longer honours it." >&2
            exit 1
          fi
          echo "container is healthy on PORT=9000"

          # The published-port half: proves the move is visible from OUTSIDE the
          # container too, not just to the in-container probe.
          curl -sf http://127.0.0.1:18080/health
          echo
          echo "non-default port honoured end to end"

      - name: Run container bound to HOST=127.0.0.1 (issue #58)
        # $PORT's sibling (#58): with HOST=127.0.0.1 the in-container HEALTHCHECK must still pass
        # AND the published port must stop answering. Either half alone proves nothing: healthy does
        # not show HOST took effect, and silence does not show the container started.
        if: contains(fromJSON(inputs.probe-targets), matrix.target)
        env:
          IMAGE: atrium-smoke/${{ inputs.image-name }}:${{ matrix.target }}
        run: |
          set -euo pipefail
          cid=$(docker run -d ${SMOKE_CACHE_MOUNT:+"$SMOKE_CACHE_MOUNT"} -e HOST=127.0.0.1 -p 18081:8000 "$IMAGE")
          echo "container: $cid (HOST=127.0.0.1)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          echo "Waiting for HEALTHCHECK to report healthy with HOST=127.0.0.1..."
          # Same 330s budget as the PORT step above, same reasoning.
          deadline=$((SECONDS + 330))
          status="starting"
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            if [ "$status" = "unhealthy" ]; then
              echo "container reported unhealthy at HOST=127.0.0.1: the in-container probe" >&2
              echo "could not reach the listener even on loopback, which HOST=127.0.0.1" >&2
              echo "should never break" >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$status" != "healthy" ]; then
            echo "container did not report healthy with HOST=127.0.0.1 within the timeout" >&2
            echo "(last status: $status)." >&2
            exit 1
          fi
          echo "container is healthy with HOST=127.0.0.1"

          # The negative half: the published interface must NOT answer. --max-time bounds
          # the curl so a hang reads as a fast, clear failure rather than a timed-out job.
          if curl -sf --max-time 5 http://127.0.0.1:18081/health >/dev/null 2>&1; then
            echo "container answered on the published interface with HOST=127.0.0.1 set —" >&2
            echo "the listener is still bound to all interfaces, i.e. HOST is not honoured" >&2
            exit 1
          fi
          echo "published interface correctly unreachable; HOST=127.0.0.1 honoured end to end"

      - name: Run container with LOG_LEVEL=WARNING and assert INFO is suppressed (issue #61)
        # #61: LOG_LEVEL=WARNING must silence the INFO records start-up emits at the default level
        # (the control is in the HEALTHCHECK step). This direction needs no request traffic, and
        # checking only that DEBUG adds output would pass with LOG_LEVEL read and ignored.
        if: contains(fromJSON(inputs.probe-targets), matrix.target)
        env:
          IMAGE: atrium-smoke/${{ inputs.image-name }}:${{ matrix.target }}
        run: |
          set -euo pipefail
          cid=$(docker run -d ${SMOKE_CACHE_MOUNT:+"$SMOKE_CACHE_MOUNT"} -e LOG_LEVEL=WARNING -p 18080:8000 "$IMAGE")
          echo "container: $cid (LOG_LEVEL=WARNING)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          echo "Waiting for HEALTHCHECK to report healthy with LOG_LEVEL=WARNING..."
          # Same 330s budget and reasoning as the default-port step above.
          deadline=$((SECONDS + 330))
          status="starting"
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            if [ "$status" = "unhealthy" ]; then
              echo "container reported unhealthy before ever becoming healthy" >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$status" != "healthy" ]; then
            echo "container did not report healthy within the timeout (last status: $status)" >&2
            exit 1
          fi
          echo "container is healthy"

          if docker logs "$cid" 2>&1 | grep -qE '^[0-9-]+ [0-9:,]+ INFO [^ ]+ '; then
            echo "an INFO-level record reached stdout with LOG_LEVEL=WARNING set (issue #61)" >&2
            echo "-- LOG_LEVEL is read but not honoured; startup/warmup logging is not" >&2
            echo "routed through the level the entrypoint configured" >&2
            exit 1
          fi
          echo "confirmed: no INFO record reaches stdout with LOG_LEVEL=WARNING"

  build-and-push:
    needs: [test, docker-build-smoke]
    # Publishes on a version tag, a release and a push to `test` (the `:test` channel, W2). With
    # `release-gate: true` nothing is pushed unless every probe leg passed (#81); `!cancelled()`
    # lets it run after a failed probe when the gate is off. `:test` is not CVE-gated (tags only).
    # Callers' concurrency groups must never cancel a tag build. History:
    # docs/decisions/docker-tool-reusable.md#when-publishing-runs
    if: >-
      !cancelled()
      && needs.test.result == 'success'
      && (needs.docker-build-smoke.result == 'success' || !inputs.release-gate)
      && (startsWith(github.ref, 'refs/tags/v')
          || github.event_name == 'release'
          || (github.event_name == 'push' && github.ref == 'refs/heads/test'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write   # SARIF upload for the post-publish scan below
    strategy:
      # Each leg publishes a different image: one target's failed gate must not cancel the
      # promotion of another target's clean image (#10; llm-enrich v0.6.0).
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.build-targets) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan, then promote (W3): the build pushes only the immutable `sha-<short>` tag
      # (meta-immutable); the release tags (meta-release: semver, `latest`, `test`) are applied by
      # the last step, only after every gate passed. A failed gate leaves only that audit tag.
      # History: docs/decisions/docker-tool-reusable.md#scan-then-promote
      - name: Extract metadata (immutable tag — pushed by the build)
        id: meta-immutable
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ inputs.image-name }}${{ matrix.target != 'base' && format('-{0}', matrix.target) || '' }}
          tags: |
            type=sha

      - name: Extract metadata (release tags — applied only after the gate)
        id: meta-release
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ inputs.image-name }}${{ matrix.target != 'base' && format('-{0}', matrix.target) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # The moving pre-release channel (issue #10): the E2E lanes run `:test` to check the
            # code about to be released before the tag is cut. `latest` is untouched.
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        # Retried once after a transient Docker Hub error, as in docker-build-smoke.
        # ci-optional: the next step retries once, without continue-on-error
        continue-on-error: true

      - name: Set up Docker Buildx (retry after a transient registry failure)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        # SHA-pinned (#18) — this invocation pushes to GHCR with packages:write.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # Immutable tag ONLY. Release tags (semver/latest/test) are applied by the
          # promotion step at the end of this job, after the gate — see W3 above.
          tags: ${{ steps.meta-immutable.outputs.tags }}
          labels: ${{ steps.meta-immutable.outputs.labels }}
          # ATRIUM_RUNNER_IMAGE names a tag this job publishes (roadmap B3, atrium-project#69): the
          # semver without the `v` on a version tag, `test` on a `test` push, else `sha-<short>`.
          # Not `:${{ github.ref_name }}` (GHCR has no `v`). Not always `sha-<short>`: the value is
          # in the ENV layer above the Dockerfiles' apt-upgrade layer and must not change per push.
          # ATRIUM_RUNNER_REF stays `github.ref_name`: a git ref, where the `v` is right.
          build-args: |
            ATRIUM_RUNNER_REPO=https://github.com/${{ github.repository }}
            ATRIUM_RUNNER_REF=${{ github.ref_name }}
            ATRIUM_RUNNER_IMAGE=ghcr.io/${{ inputs.image-name }}${{ matrix.target != 'base' && format('-{0}', matrix.target) || '' }}:${{ steps.meta-release.outputs.version || steps.meta-immutable.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM and provenance attestations, pushed with the image to the registry, where
          # `docker buildx imagetools inspect`, cosign and syft read them (#18).
          sbom: true
          provenance: true

      # ── Post-publish vulnerability scan ─────────────────────────────────────
      # Scans the digest this job just pushed. Inside the publishing job it cannot race the push,
      # as scanning `:latest` from security.reusable.yml did (#18); that workflow keeps the weekly
      # `:latest` re-scan, for newly disclosed CVEs.
      - name: Trivy scan the published digest
        # SHA-pinned (#18) — this is the action whose tags were force-pushed to
        # malware in 2026-03 (GHSA-69fq-xp46-6x23); see security.reusable.yml for
        # the full note. Dereferenced commit of the annotated tag v0.36.0.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ inputs.image-name }}${{ matrix.target != 'base' && format('-{0}', matrix.target) || '' }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Report-only ON PURPOSE: the full CRITICAL+HIGH picture reaches code scanning on every
          # build, even for a blocked release; the blocking decision is the narrower step below.
          exit-code: "0"

      - name: Upload SARIF to code scanning
        # Distinct category per matrix target, otherwise multi-target repos
        # (a repo with base/api/llm targets) overwrite each other's findings.
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-publish-${{ matrix.target }}

      # The CVE release gate (#18): a version-tag build fails on a fixable CRITICAL vulnerability,
      # after the SARIF upload so its findings are in code scanning. Narrow on purpose: tags only;
      # CRITICAL only (HIGH is report-only); fixable only (an unpatchable CVE leaves nothing to do).
      # exit-code "0" makes it report-only. History:
      # docs/decisions/docker-tool-reusable.md#the-cve-release-gate
      - name: Fail the release on fixable CRITICAL vulnerabilities
        if: startsWith(github.ref, 'refs/tags/')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ inputs.image-name }}${{ matrix.target != 'base' && format('-{0}', matrix.target) || '' }}@${{ steps.build.outputs.digest }}
          format: table   # human-readable in the log, so the failure explains itself
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ── W3: promote the release tags, only now that the gate has passed ──────
      # `if: success()` makes this a gate, not a report. `imagetools create` re-points the tags at
      # the digest already in the registry (no rebuild), so the promoted image is the scanned one:
      # `:test` on a `test` push, `<semver>` and `latest` on a version tag, nothing on a PR.
      - name: Promote release tags to the scanned digest
        if: success() && steps.meta-release.outputs.tags != ''
        env:
          DIGEST_REF: ghcr.io/${{ inputs.image-name }}${{ matrix.target != 'base' && format('-{0}', matrix.target) || '' }}@${{ steps.build.outputs.digest }}
          RELEASE_TAGS: ${{ steps.meta-release.outputs.tags }}
        run: |
          set -euo pipefail
          # metadata-action emits one tag per line.
          ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "  promoting -> $tag"
            ARGS+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "no release tags to promote"; exit 0
          fi
          docker buildx imagetools create "${ARGS[@]}" "$DIGEST_REF"
          {
            echo "### Promoted tags (post-scan)"
            echo ""
            echo "Digest: \`$DIGEST_REF\`"
            echo ""
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "- \`$tag\`"
            done <<< "$RELEASE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    # atrium-project#81: what a release certifies. After every target was promoted on a
    # version tag, read the digest each release tag resolves to in GHCR, the identity a
    # deployment pins (docs/release_trust.md, Tag identity), and hand it to the caller as the
    # `images-json` output. A job of its own because a matrix job's outputs collide: each leg
    # of build-and-push would overwrite the others'. Reading the registry, not the build's
    # digest, certifies what a pull of the tag actually gets.
    needs: build-and-push
    if: >-
      !cancelled()
      && needs.build-and-push.result == 'success'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      images-json: ${{ steps.inspect.outputs.images-json }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the digest of each promoted tag
        id: inspect
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          TARGETS: ${{ inputs.build-targets }}
          TAG_REF: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          version = os.environ["TAG_REF"].removeprefix("v")  # the image tag has no leading `v`
          images = []
          for target in json.loads(os.environ["TARGETS"]):
              image = f"ghcr.io/{os.environ['IMAGE_NAME']}" + ("" if target == "base" else f"-{target}")
              manifest = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", f"{image}:{version}", "--format", "{{json .Manifest}}"],
                  check=True, capture_output=True, text=True,
              ).stdout
              digest = json.loads(manifest)["digest"]
              images.append({"target": target, "image": image, "tag": version, "digest": digest})
          record = {
              "source": {"repository": os.environ["REPOSITORY"], "tag": os.environ["TAG_REF"], "commit": os.environ["COMMIT"]},
              "images": images,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"images-json={json.dumps(record, separators=(',', ':'))}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Images this release certifies\n\n| Target | Image | Digest |\n|---|---|---|\n")
              for entry in images:
                  summary.write(f"| {entry['target']} | `{entry['image']}:{entry['tag']}` | `{entry['digest']}` |\n")
          print(json.dumps(record, indent=2))
          PY
