- doc: Three pages; the text pages are OCRed and translated. Which pages count as text is the model's answer.
  job:
    Page images:
      class: Collection
      collection_type: list
      elements:
        - class: File
          identifier: atrium-03
          path: ../tools/atrium_page_classification/test-data/atrium-03.png
        - class: File
          identifier: pages_online_14
          path: ../tools/atrium_page_classification/test-data/pages_online_14.png
        - class: File
          identifier: atrium-34
          path: ../tools/atrium_page_classification/test-data/atrium-34.png
  outputs:
    Top-N table:
      asserts:
        has_n_lines:
          n: 4
    Text pages:
      asserts:
        has_n_lines:
          min: 0
          max: 3
