- doc: Three page images, one model (v4.4), three categories per page.
  job:
    Page images:
      class: Collection
      collection_type: list
      elements:
        - class: File
          identifier: pages_online_14
          path: ../../tools/atrium_page_classification/test-data/pages_online_14.png
        - class: File
          identifier: pages_online_54
          path: ../../tools/atrium_page_classification/test-data/pages_online_54.png
        - class: File
          identifier: atrium-34
          path: ../../tools/atrium_page_classification/test-data/atrium-34.png
  outputs:
    Top-N table:
      asserts:
        has_line:
          line: FILE,PAGE,CLASS-1,CLASS-2,CLASS-3,SCORE-1,SCORE-2,SCORE-3
        has_n_lines:
          n: 4
    Document records:
      element_tests:
        pages_online:
          asserts:
            has_text:
              text: page_categories
        atrium:
          asserts:
            has_text:
              text: page_categories
