- doc: One two-page PDF.
  job:
    PDF documents:
      class: Collection
      collection_type: list
      elements:
        - class: File
          identifier: two_pages
          path: ../tools/atrium_page_classification/test-data/two_pages.pdf
  outputs:
    Top-N tables:
      element_tests:
        two_pages:
          asserts:
            has_text:
              text: "two_pages,2,"
    Document records:
      element_tests:
        two_pages:
          asserts:
            has_text:
              text: page_categories
