# mkdocs.yml — ATRIUM aggregate documentation site (atrium-project#57)
#
# ROUND 3. The nav below matches docs_site/ exactly, in both directions.
#
# The `- Tools:` block carries the two sections that are WRITTEN --
# page-classification and translator. The other three tool repositories
# (alto-postprocess, nlp-enrich, llm-enrich) are deliberately absent: under
# `strict: true` a nav entry with no file is a build failure, so a section
# appears here only once its pages exist. nav_order reserves 40-44 and 60-74
# for them.
#
# The round-2 assembler (57.plan.md B) is RETIRED. It existed to slice each tool
# README into site pages, which is exactly the mirror the maintainer rejected
# ("no new information available" -- 34 of 38 pages were a second copy of
# something already published). These pages are written, and each one's
# `## Sources` table is a provenance record of what it was written from, not a
# build instruction.
#
# WHY docs_dir IS NOT `docs`: the hub's `docs/` already holds 13 canonical markdown
# files plus `docs/templates/` -- including `docs/templates/shared/`, which
# para-drift.reusable.yml enforces byte-identical across five repositories.
# Publishing from `docs/` would mean moving that tree, and `docs/templates` is
# referenced 363 times across the six repos, with the paths baked into the
# docstrings of the vendored files themselves. `docs_site/` costs nothing.
#
# WHY THE PUBLISHING SOURCE IS A BRANCH: Pages' branch source offers only `/` or
# `/docs` as folders -- there is no arbitrary-folder option -- and `/docs` is taken.
# So: build here, publish the result to `gh-pages`. See PAGES_SETUP.md.

site_name: ATRIUM — UFAL documentation
site_description: >-
  Documentation for the UFAL side of the ATRIUM project: the page classifier, the
  ALTO post-processor, the translator, and the NLP and LLM enrichers.
site_url: https://ufal.github.io/atrium-project/
repo_url: https://github.com/ufal/atrium-project
repo_name: ufal/atrium-project
edit_uri: ""          # pages are derived, not edited in place -- an edit link would lie
copyright: >-
  Developed by UFAL, Charles University · funded by ATRIUM · MIT licensed

docs_dir: docs_site
site_dir: site        # add to .gitignore -- the hub's current .gitignore has no
                      # build-output rule; it was written for tool caches only

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle: {icon: material/brightness-4, name: Switch to light mode}

extra_css:
  - assets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes            # every README defines its footnotes in one EOF block:
                         # 30 in nlp-enrich, 19 in page-classification, 9 in alto
                         # (numbering skips [^3]), 8 each in translator and llm-enrich
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid       # the corpus currently has ZERO ```mermaid blocks;
          class: mermaid      # docs_site/pipelines.md is where it gets its first
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# --strict is the point of the aggregate topology: every cross-repo link is
# INTERNAL here, so a broken one fails the build. Under six separate sites those
# links would be absolute URLs that --strict cannot see, and the corpus already
# contains a broken cross-file anchor
# (atrium-alto-postprocess/service/README.md:93 -> ../README.md#composite-quality-score,
#  whose only real heading is docs/categorization_logic.md:214).
strict: true

# `strict: true` alone does NOT make the anchor above a build failure: MkDocs
# defaults `validation.links.anchors` to `info`, and `--strict` promotes warnings,
# not info. Without these three lines the comment above describes an intention
# rather than a check. Measured on mkdocs 1.6.1 / mkdocs-material 9.7.7.
validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Pipelines: pipelines.md
  - Workflows:
      - Overview: workflows/index.md
      - page-classification: workflows/page-classification.md
      - alto-postprocess: workflows/alto-postprocess.md
      - translator: workflows/translator.md
      - nlp-enrich: workflows/nlp-enrich.md
      - llm-enrich: workflows/llm-enrich.md
  - External tools & services: external-tools.md
  - Ecosystem:
      - Architecture: ecosystem/architecture.md
      - Repository map: ecosystem/repository-map.md
      - The document contract: ecosystem/document-contract.md
  - Contracts:
      - RO-Crate export: contracts/rocrate.md
      - SKOS & the ATRIUM vocabulary: contracts/skos.md
      - Schemas: contracts/schemas.md
  - Agent skills: agent-skills.md
  - Operations: operations.md
  - Contributing standards: contributing-standards.md
  - Tools:
      - page-classification:
          - Overview: tools/page-classification/index.md
          - Guide: tools/page-classification/guide.md
          - Reference: tools/page-classification/reference.md
          - Changelog: tools/page-classification/changelog.md
          - History: tools/page-classification/history.md
      - translator:
          - Overview: tools/translator/index.md
          - Guide: tools/translator/guide.md
          - Reference: tools/translator/reference.md
          - Changelog: tools/translator/changelog.md
          - History: tools/translator/history.md
  - Development history: development-history.md
